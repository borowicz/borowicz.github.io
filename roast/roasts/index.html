<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Roast Browser — 4 Platforms</title>
<style>
:root{
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",sans-serif;
  color-scheme:dark;
  --bg:#101010;--panel:#191919;--border:#303030;--muted:#929292;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:#eee}
.wrap{max-width:1200px;margin:auto;padding:28px}
h1{margin:0 0 6px;font-size:32px}
.sub{color:var(--muted);margin-bottom:20px}
.controls{display:grid;grid-template-columns:1fr 1fr 1fr 2fr;gap:10px}
select,input,button{
  background:#1b1b1b;color:#eee;border:1px solid #333;border-radius:10px;
  padding:10px;font:inherit
}
button{cursor:pointer}
button:hover{background:#252525}
.card{margin-top:16px;padding:24px;background:var(--panel);border:1px solid var(--border);border-radius:18px}
.meta{color:var(--muted);font-size:13px}
.text{font-size:28px;line-height:1.3;margin:18px 0;min-height:110px}
.nav{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.count{margin-left:auto;color:var(--muted)}
table{width:100%;margin-top:18px;border-collapse:collapse}
th,td{text-align:left;padding:9px;border-bottom:1px solid #262626;vertical-align:top}
tr:hover{background:#181818}
.empty{color:var(--muted);padding:30px 0;text-align:center}
@media(max-width:850px){
  .controls{grid-template-columns:1fr 1fr}
  .text{font-size:22px}
}
@media(max-width:560px){
  .controls{grid-template-columns:1fr}
}
</style>
</head>
<body>
<div class="wrap">
  <h1>Roast Browser</h1>
  <div class="sub">macOS · iPhone · iPad · watchOS — 500 roasts each · standalone file</div>

  <div class="controls">
    <select id="platform" aria-label="Platform">
      <option value="mac">macOS — 500</option>
      <option value="iphone">iPhone — 500</option>
      <option value="ipad">iPad — 500</option>
      <option value="watch">watchOS — 500</option>
    </select>

    <select id="category" aria-label="Category">
      <option value="">All categories</option>
    </select>

    <select id="intensity" aria-label="Intensity">
      <option value="">All intensity</option>
      <option value="1">1</option>
      <option value="2">2</option>
      <option value="3">3</option>
    </select>

    <input id="search" placeholder="Search text, category, or ID" autocomplete="off">
  </div>

  <div class="card">
    <div class="meta" id="meta"></div>
    <div class="text" id="text">Loading…</div>

    <div class="nav">
      <button id="prev">← Previous</button>
      <button id="next">Next →</button>
      <button id="random">Random</button>
      <button id="copy">Copy</button>
      <span class="count" id="count"></span>
    </div>
  </div>

  <table>
    <thead>
      <tr><th>#</th><th>Category</th><th>Intensity</th><th>Roast</th></tr>
    </thead>
    <tbody id="rows"></tbody>
  </table>
</div>

let data = [];
let filtered = [];
let pos = 0;

const $ = id => document.getElementById(id);

function esc(s){
  return String(s).replace(/[&<>"']/g, m => ({
    "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"
  }[m]));
}

function loadPlatform(){
  const platform = $("platform").value;
  data = DATA[platform].roasts;
  pos = 0;

  const cats = [...new Set(data.map(x => x.category))].sort();
  $("category").innerHTML =
    '<option value="">All categories</option>' +
    cats.map(x => `<option value="${esc(x)}">${esc(x)}</option>`).join("");

  apply();
}

function apply(){
  const q = $("search").value.toLowerCase().trim();
  const c = $("category").value;
  const i = $("intensity").value;

  filtered = data.filter(x =>
    (!q || `${x.text} ${x.category} ${x.id}`.toLowerCase().includes(q)) &&
    (!c || x.category === c) &&
    (!i || String(x.intensity) === i)
  );

  pos = filtered.length ? Math.min(pos, filtered.length - 1) : 0;
  render();
}

function render(){
  if (!filtered.length){
    $("meta").textContent = "";
    $("text").textContent = "No matching roasts.";
    $("count").textContent = "0 / 0";
    $("rows").innerHTML = '<tr><td colspan="4" class="empty">Nothing matches the current filters.</td></tr>';
    return;
  }

  const r = filtered[pos];
  $("meta").textContent = `${r.id} · ${r.category} · intensity ${r.intensity}`;
  $("text").textContent = r.text;
  $("count").textContent = `${pos + 1} / ${filtered.length}`;

  $("rows").innerHTML = filtered.map((x,n) =>
    `<tr><td>${n + 1}</td><td>${esc(x.category)}</td><td>${x.intensity}</td><td>${esc(x.text)}</td></tr>`
  ).join("");
}

function move(n){
  if (!filtered.length) return;
  pos = (pos + n + filtered.length) % filtered.length;
  render();
}

function randomRoast(){
  if (!filtered.length) return;
  pos = Math.floor(Math.random() * filtered.length);
  render();
}

async function copyCurrent(){
  if (!filtered.length) return;
  const r = filtered[pos];
  try {
    await navigator.clipboard.writeText(r.text);
  } catch {
    const ta = document.createElement("textarea");
    ta.value = r.text;
    document.body.appendChild(ta);
    ta.select();
    document.execCommand("copy");
    ta.remove();
  }
}

$("platform").onchange = loadPlatform;
$("category").oninput = () => { pos = 0; apply(); };
$("intensity").oninput = () => { pos = 0; apply(); };
$("search").oninput = () => { pos = 0; apply(); };
$("prev").onclick = () => move(-1);
$("next").onclick = () => move(1);
$("random").onclick = randomRoast;
$("copy").onclick = copyCurrent;

document.addEventListener("keydown", e => {
  if (e.target.tagName === "INPUT" || e.target.tagName === "SELECT") return;
  if (e.key === "ArrowLeft") move(-1);
  if (e.key === "ArrowRight") move(1);
  if (e.key.toLowerCase() === "r") randomRoast();
  if (e.key.toLowerCase() === "c") copyCurrent();
});

loadPlatform();
</script>
