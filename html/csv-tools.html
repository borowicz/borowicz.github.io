<!doctype html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CSV Tools</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0b1020;--panel:#121933;--panel-2:#1a2347;--text:#e8ecff;--muted:#aab4da;
  --accent:#7c9cff;--accent-2:#4ee1c1;--danger:#ff6b81;--border:rgba(255,255,255,.08);
  --shadow:0 10px 30px rgba(0,0,0,.28)
}
*{box-sizing:border-box} html,body{margin:0;padding:0;font-family:Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;background:linear-gradient(180deg,#0a0f1d,#0f1630 35%,#0a1020);color:var(--text);min-height:100%}
body{padding:20px} a{color:inherit;text-decoration:none}
.container{max-width:1200px;margin:0 auto}
.topbar{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;margin-bottom:18px}
.brand{display:flex;gap:12px;align-items:center}
.logo{width:42px;height:42px;border-radius:14px;background:linear-gradient(135deg,var(--accent),var(--accent-2));box-shadow:var(--shadow)}
.title h1{margin:0;font-size:1.25rem}.title p{margin:2px 0 0;color:var(--muted);font-size:.92rem}
.actions{display:flex;gap:10px;flex-wrap:wrap}
.btn,.file,button{border:1px solid var(--border);background:linear-gradient(180deg,var(--panel-2),var(--panel));color:var(--text);padding:10px 14px;border-radius:12px;cursor:pointer;box-shadow:var(--shadow)}
button:hover,.btn:hover{transform:translateY(-1px)}
.grid{display:grid;grid-template-columns:repeat(12,1fr);gap:16px}
.card{grid-column:span 12;background:linear-gradient(180deg,rgba(255,255,255,.03),rgba(255,255,255,.01));border:1px solid var(--border);border-radius:20px;padding:18px;box-shadow:var(--shadow);backdrop-filter: blur(4px)}
@media(min-width:860px){.span-6{grid-column:span 6}.span-4{grid-column:span 4}.span-8{grid-column:span 8}.span-12{grid-column:span 12}}
label{display:block;font-size:.88rem;color:var(--muted);margin:0 0 8px}
input,select,textarea{width:100%;background:#0b1228;color:var(--text);border:1px solid var(--border);border-radius:14px;padding:12px 14px;outline:none}
textarea{min-height:180px;resize:vertical}
input[type="color"]{padding:4px;height:48px}
input:focus,select:focus,textarea:focus{border-color:rgba(124,156,255,.7);box-shadow:0 0 0 3px rgba(124,156,255,.15)}
.row{display:grid;grid-template-columns:repeat(12,1fr);gap:12px}
.col-6,.col-4,.col-3,.col-8,.col-12{grid-column:span 12}
@media(min-width:860px){.col-6{grid-column:span 6}.col-4{grid-column:span 4}.col-3{grid-column:span 3}.col-8{grid-column:span 8}.col-12{grid-column:span 12}}
.muted{color:var(--muted)} .small{font-size:.88rem}
pre,code,.output{background:#091022;border:1px solid var(--border);border-radius:14px;padding:14px;overflow:auto;white-space:pre-wrap;word-break:break-word}
.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}
.badge{display:inline-block;padding:6px 10px;border-radius:999px;background:rgba(124,156,255,.12);border:1px solid rgba(124,156,255,.25);font-size:.8rem;color:#dbe4ff}
.table{width:100%;border-collapse:collapse}.table th,.table td{border-bottom:1px solid var(--border);padding:10px;text-align:left;vertical-align:top}.table th{color:var(--muted);font-weight:600}
.hero{margin:4px 0 16px;color:var(--muted)}
.footer{margin-top:18px;color:var(--muted);font-size:.86rem}
.preview{border:1px dashed var(--border);border-radius:16px;padding:16px;background:rgba(255,255,255,.02)}
.flex{display:flex;gap:12px;flex-wrap:wrap}
.kv{display:grid;grid-template-columns:180px 1fr;gap:10px}
.links{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px}
.links a{display:block;padding:14px;border-radius:16px;background:linear-gradient(180deg,var(--panel-2),var(--panel));border:1px solid var(--border);box-shadow:var(--shadow)}
</style>
</head><body><div class="container">
<div class="topbar"><div class="brand"><div class="logo"></div><div class="title"><h1>CSV Tools</h1><p>Preview, sort, filter and convert CSV ↔ JSON.</p></div></div>
<div class="actions"><a class="btn" href="../index.html">← Back</a></div></div>

<div class="grid">
<section class="card span-6"><label>CSV input</label><textarea id="src">name,age,city
Alice,30,Warsaw
Bob,22,Krakow
Carla,26,Gdansk</textarea>
<div class="toolbar"><button id="parse">Parse</button><button id="tojson">CSV → JSON</button><button id="tocsv">JSON → CSV</button></div>
<label>Filter contains</label><input id="filter" placeholder="type to filter rows"></section>
<section class="card span-6"><pre id="json"></pre></section>
<section class="card span-12"><div style="overflow:auto"><table class="table" id="tbl"></table></div></section></div>

<div class="footer">Static client-side HTML tool.</div></div>
<script>
const $ = (s,root=document)=>root.querySelector(s);
const $$ = (s,root=document)=>Array.from(root.querySelectorAll(s));
function esc(s){return String(s).replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]))}
function copyText(text){
  navigator.clipboard?.writeText(text);
}
</script>
<script>
function parseCSV(text){
 const rows=[]; let row=[], cell='', q=false;
 for(let i=0;i<text.length;i++){ const ch=text[i], nx=text[i+1];
   if(ch=='"'){ if(q && nx=='"'){cell+='"'; i++;} else q=!q; }
   else if(ch===',' && !q){ row.push(cell); cell=''; }
   else if((ch==='\n' || ch==='\r') && !q){ if(ch==='\r'&&nx==='\n') i++; row.push(cell); if(row.some(x=>x!=='')) rows.push(row); row=[]; cell='';}
   else cell+=ch;
 }
 row.push(cell); if(row.some(x=>x!=='')) rows.push(row); return rows;
}
let current=[];
function renderTable(rows){
 if(!rows.length){ $('#tbl').innerHTML=''; return;}
 const head=rows[0];
 let body=rows.slice(1);
 const f=$('#filter').value.toLowerCase();
 if(f) body=body.filter(r=>r.join(' | ').toLowerCase().includes(f));
 $('#tbl').innerHTML=`<thead><tr>${head.map((h,i)=>`<th data-i="${i}">${esc(h)} ↕</th>`).join('')}</tr></thead><tbody>${body.map(r=>`<tr>${head.map((_,i)=>`<td>${esc(r[i]??'')}</td>`).join('')}</tr>`).join('')}</tbody>`;
 $$('#tbl th').forEach(th=>th.onclick=()=>{ const i=+th.dataset.i; body.sort((a,b)=>String(a[i]??'').localeCompare(String(b[i]??''),undefined,{numeric:true})); $('#tbl').querySelector('tbody').innerHTML=body.map(r=>`<tr>${head.map((_,j)=>`<td>${esc(r[j]??'')}</td>`).join('')}</tr>`).join('');});
}
function csvToJson(rows){ const [h,...b]=rows; return b.map(r=>Object.fromEntries(h.map((k,i)=>[k,r[i]??''])));}
$('#parse').onclick=()=>{ current=parseCSV($('#src').value); renderTable(current); $('#json').textContent=JSON.stringify(csvToJson(current),null,2); };
$('#tojson').onclick=()=>{ try{current=parseCSV($('#src').value); $('#json').textContent=JSON.stringify(csvToJson(current),null,2);}catch(e){$('#json').textContent=e.message;} };
$('#tocsv').onclick=()=>{ try{ const arr=JSON.parse($('#src').value); const keys=[...new Set(arr.flatMap(o=>Object.keys(o)))]; const csv=[keys.join(',')].concat(arr.map(o=>keys.map(k=>JSON.stringify(o[k]??'')).join(','))).join('\n'); $('#json').textContent=csv; }catch(e){ $('#json').textContent='Invalid JSON'; } };
$('#filter').oninput=()=>renderTable(current); $('#parse').click();
</script></body></html>
