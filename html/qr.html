<!doctype html>
<html lang="en">
<head>
<title>QR Code Generator</title>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0b1020;--panel:#121933;--panel-2:#1a2347;--text:#e8ecff;--muted:#aab4da;
  --accent:#7c9cff;--accent-2:#4ee1c1;--danger:#ff6b81;--border:rgba(255,255,255,.08);
  --shadow:0 10px 30px rgba(0,0,0,.28)
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;font-family:Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;background:linear-gradient(180deg,#0a0f1d,#0f1630 35%,#0a1020);color:var(--text);min-height:100%}
a{color:inherit;text-decoration:none}
.container{max-width:1200px;margin:0 auto;padding:20px}
.topbar{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;margin-bottom:18px}
.brand{display:flex;gap:12px;align-items:center}
.logo{width:42px;height:42px;border-radius:14px;background:linear-gradient(135deg,var(--accent),var(--accent-2));box-shadow:var(--shadow)}
.title h1{margin:0;font-size:1.25rem}
.title p{margin:2px 0 0;color:var(--muted);font-size:.92rem}
.actions{display:flex;gap:10px;flex-wrap:wrap}
.btn,.file{border:1px solid var(--border);background:linear-gradient(180deg,var(--panel-2),var(--panel));color:var(--text);padding:10px 14px;border-radius:12px;cursor:pointer;box-shadow:var(--shadow)}
.btn:hover{transform:translateY(-1px)}
.grid{display:grid;grid-template-columns:repeat(12,1fr);gap:16px}
.card{grid-column:span 12;background:linear-gradient(180deg,rgba(255,255,255,.03),rgba(255,255,255,.01));border:1px solid var(--border);border-radius:20px;padding:18px;box-shadow:var(--shadow);backdrop-filter: blur(4px)}
@media(min-width:860px){
  .span-5{grid-column:span 5}
  .span-7{grid-column:span 7}
  .span-6{grid-column:span 6}
  .span-4{grid-column:span 4}
  .span-8{grid-column:span 8}
  .span-12{grid-column:span 12}
}
label{display:block;font-size:.88rem;color:var(--muted);margin:0 0 8px}
input,select,textarea{width:100%;background:#0b1228;color:var(--text);border:1px solid var(--border);border-radius:14px;padding:12px 14px;outline:none}
textarea{min-height:220px;resize:vertical}
input:focus,select:focus,textarea:focus{border-color:rgba(124,156,255,.7);box-shadow:0 0 0 3px rgba(124,156,255,.15)}
.row{display:grid;grid-template-columns:repeat(12,1fr);gap:12px}
.col-6{grid-column:span 12}
.col-4{grid-column:span 12}
.col-3{grid-column:span 12}
.col-8{grid-column:span 12}
@media(min-width:860px){
  .col-6{grid-column:span 6}.col-4{grid-column:span 4}.col-3{grid-column:span 3}.col-8{grid-column:span 8}
}
.muted{color:var(--muted)}
.small{font-size:.88rem}
pre,code,.output{background:#091022;border:1px solid var(--border);border-radius:14px;padding:14px;overflow:auto;white-space:pre-wrap;word-break:break-word}
.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}
.badge{display:inline-block;padding:6px 10px;border-radius:999px;background:rgba(124,156,255,.12);border:1px solid rgba(124,156,255,.25);font-size:.8rem;color:#dbe4ff}
.list{display:grid;gap:10px}
.kv{display:grid;grid-template-columns:180px 1fr;gap:10px}
.table{width:100%;border-collapse:collapse}
.table th,.table td{border-bottom:1px solid var(--border);padding:10px;text-align:left;vertical-align:top}
.table th{color:var(--muted);font-weight:600}
.hero{margin:4px 0 16px;color:var(--muted)}
nav.links{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:14px}
nav.links a{display:block;padding:16px;border-radius:18px;background:linear-gradient(180deg,var(--panel-2),var(--panel));border:1px solid var(--border);box-shadow:var(--shadow)}
nav.links a strong{display:block;margin-bottom:6px}
.hl{background:rgba(255,230,102,.18);border-radius:6px;padding:0 2px}
.footer{margin-top:18px;color:var(--muted);font-size:.86rem}
</style>
</head>
<body>
<div class="container">
  <div class="topbar">
    <div class="brand">
      <div class="logo"></div>
      <div class="title">
        <h1>QR Code Generator</h1>
        <p>Create QR codes for text, Wi‑Fi, email and contacts</p>
      </div>
    </div>
    <div class="actions">
      <a class="btn" href="./index.html">← Back to toolbox</a>
    </div>
  </div>
  
<div class="grid">
  <div class="card span-5">
    <label>Content type</label>
    <select id="qrMode" onchange="loadMode()">
      <option value="text">Plain text / URL</option>
      <option value="wifi">Wi‑Fi</option>
      <option value="mailto">Email</option>
      <option value="vcard">vCard</option>
    </select>
    <div id="qrFields" class="list" style="margin-top:12px"></div>
    <div class="toolbar">
      <button class="btn" onclick="generateQR()">Generate</button>
    </div>
  </div>
  <div class="card span-7">
    <div id="qrcode" class="output" style="display:flex;justify-content:center;align-items:center;min-height:320px"></div>
    <pre id="qrPayload"></pre>
  </div>
</div>

  <div class="footer">Static GitHub Pages ready • Client-side only</div>
</div>

<script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.3/build/qrcode.min.js"></script>
<script>
function loadMode(){
  const mode = document.getElementById('qrMode').value;
  const wrap = document.getElementById('qrFields');
  if(mode==='text') wrap.innerHTML = '<label>Text or URL</label><textarea id="f1">https://example.com</textarea>';
  if(mode==='wifi') wrap.innerHTML = '<label>SSID</label><input id="f1" value="MyWiFi"><label>Password</label><input id="f2" value="secret123"><label>Security</label><select id="f3"><option>WPA</option><option>WEP</option><option>nopass</option></select>';
  if(mode==='mailto') wrap.innerHTML = '<label>Email</label><input id="f1" value="hello@example.com"><label>Subject</label><input id="f2" value="Hello"><label>Body</label><textarea id="f3">Message</textarea>';
  if(mode==='vcard') wrap.innerHTML = '<label>Full name</label><input id="f1" value="Jane Doe"><label>Phone</label><input id="f2" value="+48123123123"><label>Email</label><input id="f3" value="jane@example.com"><label>Company</label><input id="f4" value="Example Inc.">';
}
function getPayload(){
  const mode = document.getElementById('qrMode').value;
  if(mode==='text') return document.getElementById('f1').value;
  if(mode==='wifi') return `WIFI:T:${document.getElementById('f3').value};S:${document.getElementById('f1').value};P:${document.getElementById('f2').value};;`;
  if(mode==='mailto') return `mailto:${document.getElementById('f1').value}?subject=${encodeURIComponent(document.getElementById('f2').value)}&body=${encodeURIComponent(document.getElementById('f3').value)}`;
  if(mode==='vcard') return `BEGIN:VCARD\nVERSION:3.0\nFN:${document.getElementById('f1').value}\nTEL:${document.getElementById('f2').value}\nEMAIL:${document.getElementById('f3').value}\nORG:${document.getElementById('f4').value}\nEND:VCARD`;
}
function generateQR(){
  const payload = getPayload();
  document.getElementById('qrPayload').textContent = payload;
  QRCode.toCanvas(payload, {width: 280, margin: 1}, function (err, canvas) {
    const box = document.getElementById('qrcode'); box.innerHTML = '';
    if(err){ box.textContent = err.message; return; }
    box.appendChild(canvas);
  });
}
loadMode(); generateQR();
</script>
<div class="footer">&copy; borowicz.github.io/html/</div>
</body>
</html>
