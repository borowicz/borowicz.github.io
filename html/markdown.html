<!doctype html>
<html lang="pl">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Markdown Preview</title>
    <style>
        :root {
            --bg: #0b1020;
            --panel: rgba(18, 24, 46, .92);
            --panel2: rgba(255, 255, 255, .04);
            --border: rgba(255, 255, 255, .12);
            --text: #edf2ff;
            --muted: #97a3c6;
            --accent: #7c9cff;
            --accent2: #9c7cff;
            --good: #49c68a;
            --warn: #ffbf5e;
            --bad: #ff7d7d;
            --radius: 22px;
            --shadow: 0 22px 60px rgba(0, 0, 0, .35)
        }

        * {
            box-sizing: border-box
        }

        html, body {
            margin: 0;
            min-height: 100%;
            font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            color: var(--text);
            background: radial-gradient(circle at top left, rgba(124, 156, 255, .22), transparent 30%), radial-gradient(circle at top right, rgba(156, 124, 255, .18), transparent 28%), linear-gradient(180deg, #0a1020 0%, #10182b 100%)
        }

        body {
            padding: 24px
        }

        .page {
            width: min(1160px, 100%);
            margin: 0 auto;
            display: grid;
            gap: 18px
        }

        .hero, .card {
            border: 1px solid var(--border);
            border-radius: calc(var(--radius) + 4px);
            background: var(--panel);
            box-shadow: var(--shadow);
            overflow: hidden
        }

        .hero {
            padding: 28px;
            display: grid;
            grid-template-columns:1.15fr .85fr;
            gap: 18px;
            align-items: stretch
        }

        .eyebrow {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 8px 12px;
            border-radius: 999px;
            border: 1px solid var(--border);
            background: rgba(255, 255, 255, .04);
            color: var(--muted);
            font-size: 13px;
            letter-spacing: .04em;
            text-transform: uppercase;
            margin-bottom: 14px
        }

        h1 {
            margin: 0 0 10px;
            font-size: clamp(32px, 5vw, 52px);
            line-height: .98;
            letter-spacing: -.04em
        }

        .hero p {
            margin: 0;
            color: var(--muted);
            font-size: 16px;
            line-height: 1.7;
            max-width: 70ch
        }

        .hero-stats {
            display: grid;
            gap: 12px
        }

        .stat {
            border: 1px solid var(--border);
            border-radius: 18px;
            background: var(--panel2);
            padding: 16px
        }

        .stat strong {
            display: block;
            font-size: 26px;
            margin-bottom: 6px;
            letter-spacing: -.03em
        }

        .stat span {
            color: var(--muted);
            font-size: 14px;
            line-height: 1.55
        }

        .layout {
            display: grid;
            grid-template-columns:1fr;
            gap: 18px
        }

        .card-header {
            padding: 18px 20px;
            border-bottom: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            gap: 12px;
            align-items: center
        }

        .card-header h2 {
            margin: 0;
            font-size: 19px
        }

        .card-header span, .muted {
            color: var(--muted);
            font-size: 13px
        }

        .card-body {
            padding: 20px
        }

        .form-grid {
            display: grid;
            grid-template-columns:repeat(2, minmax(0, 1fr));
            gap: 14px
        }

        .field {
            display: grid;
            gap: 8px
        }

        .field.full {
            grid-column: 1/-1
        }

        label {
            font-size: 14px;
            color: var(--muted)
        }

        input, select, button, textarea {
            font: inherit
        }

        input, select, textarea {
            width: 100%;
            min-height: 52px;
            border-radius: 16px;
            border: 1px solid var(--border);
            background: rgba(255, 255, 255, .04);
            color: var(--text);
            padding: 12px 14px;
            outline: none
        }

        textarea {
            min-height: 220px;
            resize: vertical
        }

        input:focus, select:focus, textarea:focus {
            border-color: rgba(124, 156, 255, .65);
            box-shadow: 0 0 0 4px rgba(124, 156, 255, .08)
        }

        .actions {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin-top: 18px
        }

        .btn {
            min-height: 48px;
            padding: 0 16px;
            border-radius: 16px;
            border: 1px solid var(--border);
            background: rgba(255, 255, 255, .05);
            color: var(--text);
            cursor: pointer;
            transition: .2s ease
        }

        .btn:hover {
            background: rgba(255, 255, 255, .08);
            transform: translateY(-1px)
        }

        .btn.primary {
            background: linear-gradient(135deg, rgba(124, 156, 255, .95), rgba(156, 124, 255, .95));
            border-color: transparent
        }

        .result-main {
            border: 1px solid var(--border);
            border-radius: 20px;
            padding: 18px;
            background: linear-gradient(180deg, rgba(255, 255, 255, .06), rgba(255, 255, 255, .03))
        }

        .result-main strong {
            display: block;
            font-size: clamp(28px, 5vw, 44px);
            line-height: 1;
            letter-spacing: -.04em;
            margin-bottom: 8px
        }

        .result-main p {
            margin: 0;
            color: var(--muted);
            line-height: 1.65
        }

        .details-grid {
            display: grid;
            grid-template-columns:repeat(3, minmax(0, 1fr));
            gap: 12px
        }

        .detail {
            border: 1px solid var(--border);
            border-radius: 16px;
            background: rgba(255, 255, 255, .04);
            padding: 14px
        }

        .detail strong {
            display: block;
            font-size: 20px;
            margin-bottom: 5px
        }

        .detail span {
            color: var(--muted);
            font-size: 13px;
            line-height: 1.5
        }

        .two-panels {
            display: grid;
            grid-template-columns:1fr;
            gap: 12px
        }

        .output {
            white-space: pre-wrap;
            word-break: break-word
        }

        .pill {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            min-height: 36px;
            padding: 0 12px;
            border-radius: 999px;
            border: 1px solid var(--border);
            background: rgba(255, 255, 255, .04);
            font-size: 14px
        }

        .good {
            color: var(--good)
        }

        .warn {
            color: var(--warn)
        }

        .bad {
            color: var(--bad)
        }

        table {
            width: 100%;
            border-collapse: collapse
        }

        th, td {
            border: 1px solid var(--border);
            padding: 10px;
            text-align: left;
            vertical-align: top
        }

        th {
            background: rgba(255, 255, 255, .04)
        }

        .swatches {
            display: grid;
            grid-template-columns:repeat(5, minmax(0, 1fr));
            gap: 12px
        }

        .swatch {
            border-radius: 18px;
            overflow: hidden;
            border: 1px solid var(--border)
        }

        .swatch-color {
            height: 90px
        }

        .swatch-meta {
            padding: 10px;
            font-size: 13px;
            color: var(--muted)
        }

        .mono {
            font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace
        }

        .note {
            margin-top: 14px;
            padding: 14px;
            border-radius: 16px;
            border: 1px solid var(--border);
            background: rgba(255, 255, 255, .04);
            color: var(--muted);
            line-height: 1.65;
            font-size: 14px
        }

        @media (max-width: 980px) {
            .hero {
                grid-template-columns:1fr
            }

            .layout, .two-panels {
                grid-template-columns:1fr
            }

            .details-grid, .form-grid, .swatches {
                grid-template-columns:1fr 1fr
            }
        }

        @media (max-width: 640px) {
            body {
                padding: 14px
            }

            .hero, .card-body {
                padding: 16px
            }

            .form-grid, .details-grid, .swatches {
                grid-template-columns:1fr
            }
        }
    </style>
</head>
<body>
<div class="page">
    <section class="hero">
        <div>
            <div class="eyebrow">📝 github.io html / css / js</div>
            <h1>Markdown Preview</h1>
            <p>Lekki podgląd Markdown z podstawową składnią: nagłówki, listy, cytaty, kod, linki i tabele.</p>
        </div>
        <div class="hero-stats">
            <div class="stat"><strong id="heroMode">Markdown</strong><span>Edycja i podgląd obok siebie.</span></div>
            <div class="stat"><strong id="heroLines">—</strong><span>Liczba linii wejściowych.</span></div>
        </div>
    </section>

    <section class="layout">
        <article class="card">
            <div class="card-header"><h2>Markdown input</h2><span>Edytor</span></div>
            <div class="card-body">
<textarea id="mdInput" class="mono" spellcheck="false"># Demo

To jest **markdown**.

- item 1
- item 2

> cytat

## Kod

```js
console.log('hello');
```

| name | value |
|---|---|
| a | 1 |
| b | 2 |
</textarea>
                <div class="actions">
                    <button class="btn primary" id="renderBtn">Render</button>
                    <button class="btn" id="copyHtmlBtn">Kopiuj HTML</button>
                </div>
            </div>
        </article>
        <article class="card">
            <div class="card-header"><h2>Preview</h2><span>Podgląd HTML</span></div>
            <div class="card-body">
                <div id="preview" class="note" style="min-height:220px;"></div>
            </div>
        </article>
    </section>

    <div class="footer">
        <p style="text-align: center; color: #1a2347">&copy; <a style="color: #cccc;" href="./../" title="borowicz.github.io">borowicz.github.io</a>
    </div>
</div>
<script>
    const mdInput = document.getElementById('mdInput'), preview = document.getElementById('preview');

    function esc(s) {
        return s.replace(/[&<>]/g, m => ({'&': '&amp;', '<': '&lt;', '>': '&gt;'}[m]));
    }

    function inline(s) {
        return esc(s)
            .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
            .replace(/\*(.+?)\*/g, '<em>$1</em>')
            .replace(/`([^`]+)`/g, '<code>$1</code>')
            .replace(/\[(.+?)\]\((.+?)\)/g, '<a href="$2" target="_blank" rel="noopener noreferrer">$1</a>');
    }

    function renderMD(src) {
        const lines = src.split(/\r?\n/);
        let html = '', inUl = false, inCode = false, code = [];
        for (let i = 0; i < lines.length; i++) {
            const line = lines[i];
            if (line.startsWith('```')) {
                if (!inCode) {
                    inCode = true;
                    code = [];
                } else {
                    html += `<pre><code>${esc(code.join('\n'))}</code></pre>`;
                    inCode = false;
                }
                continue;
            }
            if (inCode) {
                code.push(line);
                continue;
            }
            if (/^\|.*\|$/.test(line) && i + 1 < lines.length && /^\|?[- :|]+\|$/.test(lines[i + 1])) {
                const headers = line.split('|').slice(1, -1).map(x => x.trim());
                html += '<table><thead><tr>' + headers.map(h => `<th>${inline(h)}</th>`).join('') + '</tr></thead><tbody>';
                i += 2;
                while (i < lines.length && /^\|.*\|$/.test(lines[i])) {
                    const cells = lines[i].split('|').slice(1, -1).map(x => x.trim());
                    html += '<tr>' + cells.map(c => `<td>${inline(c)}</td>`).join('') + '</tr>';
                    i++;
                }
                html += '</tbody></table>';
                i--;
                continue;
            }
            if (/^# /.test(line)) {
                if (inUl) {
                    html += '</ul>';
                    inUl = false;
                }
                html += `<h1>${inline(line.slice(2))}</h1>`;
                continue;
            }
            if (/^## /.test(line)) {
                if (inUl) {
                    html += '</ul>';
                    inUl = false;
                }
                html += `<h2>${inline(line.slice(3))}</h2>`;
                continue;
            }
            if (/^### /.test(line)) {
                if (inUl) {
                    html += '</ul>';
                    inUl = false;
                }
                html += `<h3>${inline(line.slice(4))}</h3>`;
                continue;
            }
            if (/^- /.test(line)) {
                if (!inUl) {
                    html += '<ul>';
                    inUl = true;
                }
                html += `<li>${inline(line.slice(2))}</li>`;
                continue;
            } else if (inUl) {
                html += '</ul>';
                inUl = false;
            }
            if (/^> /.test(line)) {
                html += `<blockquote>${inline(line.slice(2))}</blockquote>`;
                continue;
            }
            if (!line.trim()) {
                html += '';
                continue;
            }
            html += `<p>${inline(line)}</p>`;
        }
        if (inUl) html += '</ul>';
        return html;
    }

    function render() {
        preview.innerHTML = renderMD(mdInput.value);
        heroLines.textContent = mdInput.value.split(/\r?\n/).length;
    }

    renderBtn.onclick = render;
    copyHtmlBtn.onclick = () => navigator.clipboard.writeText(preview.innerHTML);
    render();
</script>
</body>
</html>
