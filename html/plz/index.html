<!doctype html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PLZ Search</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 1100px;
            margin: 40px auto;
            padding: 20px;
            line-height: 1.4;
        }

        h1 {
            margin-bottom: 20px;
        }

        .search-wrap {
            position: relative;
            max-width: 700px;
        }

        .autocomplete-list {
            position: absolute;
            top: 46px;
            left: 0;
            right: 86px;
            background: #fff;
            border: 1px solid #ccc;
            border-top: none;
            box-shadow: 0 4px 10px rgba(0,0,0,0.08);
            max-height: 260px;
            overflow-y: auto;
            z-index: 1000;
        }

        .autocomplete-item {
            padding: 10px 12px;
            cursor: pointer;
            border-top: 1px solid #f2f2f2;
        }

        .autocomplete-item:hover,
        .autocomplete-item.active {
            background: #f3f6fb;
        }

        .autocomplete-main {
            font-weight: bold;
        }

        .autocomplete-sub {
            font-size: 13px;
            color: #666;
            margin-top: 2px;
        }

        .search-bar {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin-bottom: 12px;
        }

        input, button {
            padding: 10px 12px;
            font-size: 16px;
        }

        input {
            flex: 1;
            min-width: 260px;
        }

        button {
            cursor: pointer;
        }

        .muted {
            color: #666;
            margin: 8px 0 16px;
        }

        .table-wrap {
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 8px;
        }

        th, td {
            border: 1px solid #ddd;
            padding: 10px;
            text-align: left;
            vertical-align: top;
        }

        th {
            background: #f4f4f4;
        }

        tr:nth-child(even) {
            background: #fafafa;
        }

        .empty {
            padding: 16px;
            border: 1px dashed #ccc;
            color: #666;
            margin-top: 12px;
        }
    </style>
</head>
<body>
<h1>Wyszukiwarka PLZ</h1>

<div class="search-wrap">
    <div class="search-bar">
        <input
                type="text"
                id="query"
                placeholder="Wpisz ZIP, miasto, code, state lub note"
                autocomplete="off"
        >
        <button id="searchBtn">Szukaj</button>
    </div>
    <div id="autocompleteList" class="autocomplete-list" style="display:none;"></div>
</div>

<div class="muted" id="status">Ładowanie bazy danych...</div>

<div class="table-wrap">
    <table id="resultsTable" style="display:none;">
        <thead>
        <tr>
            <th>ZIP</th>
            <th>City</th>
            <th>Code</th>
            <th>State</th>
            <th>Note</th>
        </tr>
        </thead>
        <tbody id="resultsBody"></tbody>
    </table>
    <p class="status" style="text-align: center; color: #1a2347">&copy; borowicz.github.io</div>
</div>

<div id="emptyState" class="empty" style="display:none;">
    Brak wyników.
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/sql.js/1.10.3/sql-wasm.min.js"></script>
<script>
    let db = null;
    let autocompleteIndex = -1;
    let autocompleteItems = [];

    async function loadDatabase() {
        const SQL = await initSqlJs({
            locateFile: file => `https://cdnjs.cloudflare.com/ajax/libs/sql.js/1.10.3/${file}`
        });

        const response = await fetch('./plz.sqlite', { cache: 'no-cache' });

        if (!response.ok) {
            throw new Error(`Nie udało się pobrać bazy: ${response.status} ${response.statusText} (${response.url})`);
        }

        const buffer = await response.arrayBuffer();
        db = new SQL.Database(new Uint8Array(buffer));

        document.getElementById('status').textContent = 'Baza została załadowana.';
    }

    function escapeHtml(value) {
        return String(value ?? '')
            .replace(/&/g, '&amp;')
            .replace(/</g, '&lt;')
            .replace(/>/g, '&gt;')
            .replace(/"/g, '&quot;')
            .replace(/'/g, '&#039;');
    }

    function clearResults() {
        document.getElementById('resultsBody').innerHTML = '';
        document.getElementById('resultsTable').style.display = 'none';
        document.getElementById('emptyState').style.display = 'none';
    }

    function closeAutocomplete() {
        const list = document.getElementById('autocompleteList');
        if (list) {
            list.innerHTML = '';
            list.style.display = 'none';
        }
    }

    function renderAutocomplete(items) {
        const list = document.getElementById('autocompleteList');
        list.innerHTML = '';
        autocompleteItems = items;
        autocompleteIndex = -1;

        if (!items.length) {
            list.style.display = 'none';
            return;
        }

        items.forEach((item, index) => {
            const div = document.createElement('div');
            div.className = 'autocomplete-item';
            div.dataset.index = index;
            div.innerHTML = `
                <div class="autocomplete-main">${escapeHtml(item.zip)} — ${escapeHtml(item.city)}</div>
                <div class="autocomplete-sub">${escapeHtml(item.state)} | ${escapeHtml(item.code)}${item.note ? ' | ' + escapeHtml(item.note) : ''}</div>
            `;

            div.addEventListener('mousedown', function (event) {
                event.preventDefault();
                document.getElementById('query').value = item.zip;
                closeAutocomplete();
                search(item.zip);
            });

            list.appendChild(div);
        });

        list.style.display = 'block';
    }

    function setActiveAutocompleteItem() {
        const items = document.querySelectorAll('.autocomplete-item');
        items.forEach(item => item.classList.remove('active'));

        if (autocompleteIndex >= 0 && items[autocompleteIndex]) {
            items[autocompleteIndex].classList.add('active');
            items[autocompleteIndex].scrollIntoView({ block: 'nearest' });
        }
    }

    function updateAutocomplete() {
        const q = document.getElementById('query').value.trim();

        if (!db || q.length < 2) {
            closeAutocomplete();
            return;
        }

        const sql = `
            SELECT city, zip, code, state, note
            FROM plz
            WHERE zip LIKE ?
               OR city LIKE ?
               OR code LIKE ?
               OR state LIKE ?
            ORDER BY
                CASE
                    WHEN zip LIKE ? THEN 0
                    WHEN city LIKE ? THEN 1
                    ELSE 2
                END,
                city ASC,
                zip ASC
            LIMIT 10
        `;

        const stmt = db.prepare(sql);
        const prefix = `${q}%`;
        const contains = `%${q}%`;

        stmt.bind([
            prefix,
            contains,
            contains,
            contains,
            prefix,
            contains
        ]);

        const items = [];

        while (stmt.step()) {
            items.push(stmt.getAsObject());
        }

        stmt.free();
        renderAutocomplete(items);
    }

    function search(forcedQuery = null) {
        const q = (forcedQuery ?? document.getElementById('query').value).trim();
        const tbody = document.getElementById('resultsBody');
        const table = document.getElementById('resultsTable');
        const emptyState = document.getElementById('emptyState');
        const status = document.getElementById('status');

        clearResults();
        closeAutocomplete();

        if (!db) {
            status.textContent = 'Baza nie jest jeszcze gotowa.';
            return;
        }

        if (!q) {
            status.textContent = 'Wpisz frazę do wyszukania.';
            return;
        }

        const sql = `
                SELECT
                    city,
                    zip,
                    code,
                    state,
                    note
                FROM plz
                WHERE zip LIKE ?
                   OR city LIKE ?
                   OR code LIKE ?
                   OR state LIKE ?
                   OR note LIKE ?
                ORDER BY
                    CASE
                        WHEN zip = ? THEN 0
                        WHEN zip LIKE ? THEN 1
                        WHEN city LIKE ? THEN 2
                        ELSE 3
                    END,
                    city ASC,
                    zip ASC
                LIMIT 200
            `;

        const stmt = db.prepare(sql);

        const zipPrefix = `${q}%`;
        const contains = `%${q}%`;

        stmt.bind([
            zipPrefix,
            contains,
            contains,
            contains,
            contains,
            q,
            zipPrefix,
            contains
        ]);

        let found = 0;

        while (stmt.step()) {
            const row = stmt.getAsObject();

            const tr = document.createElement('tr');
            tr.innerHTML = `
                    <td>${escapeHtml(row.zip)}</td>
                    <td>${escapeHtml(row.city)}</td>
                    <td>${escapeHtml(row.code)}</td>
                    <td>${escapeHtml(row.state)}</td>
                    <td>${escapeHtml(row.note)}</td>
                `;
            tbody.appendChild(tr);
            found++;
        }

        stmt.free();

        if (found > 0) {
            table.style.display = 'table';
            status.textContent = `Znaleziono ${found} wyników.`;
        } else {
            emptyState.style.display = 'block';
            status.textContent = 'Nie znaleziono wyników.';
        }
    }

    document.getElementById('searchBtn').addEventListener('click', search);

    document.getElementById('query').addEventListener('input', updateAutocomplete);

    document.getElementById('query').addEventListener('keydown', function (event) {
        if (autocompleteItems.length && event.key === 'ArrowDown') {
            event.preventDefault();
            autocompleteIndex = Math.min(autocompleteIndex + 1, autocompleteItems.length - 1);
            setActiveAutocompleteItem();
            return;
        }

        if (autocompleteItems.length && event.key === 'ArrowUp') {
            event.preventDefault();
            autocompleteIndex = Math.max(autocompleteIndex - 1, 0);
            setActiveAutocompleteItem();
            return;
        }

        if (event.key === 'Enter') {
            event.preventDefault();

            if (autocompleteItems.length && autocompleteIndex >= 0) {
                const selected = autocompleteItems[autocompleteIndex];
                document.getElementById('query').value = selected.zip;
                closeAutocomplete();
                search(selected.zip);
                return;
            }

            search();
        }

        if (event.key === 'Escape') {
            closeAutocomplete();
        }
    });

    document.addEventListener('click', function (event) {
        const list = document.getElementById('autocompleteList');
        const input = document.getElementById('query');
        if (list && !list.contains(event.target) && event.target !== input) {
            closeAutocomplete();
        }
    });

    loadDatabase().catch(error => {
        console.error(error);
        document.getElementById('status').textContent = `Błąd ładowania bazy danych: ${error.message}`;
    });
</script>

</body>
</html>
