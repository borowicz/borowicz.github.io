<!doctype html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Relationship HTTP Status Codes</title>
    <style>
        :root {
            --bg: #0b1020;
            --bg-soft: #121933;
            --card: rgba(255,255,255,0.06);
            --card-border: rgba(255,255,255,0.12);
            --text: #eef2ff;
            --muted: #aab4d6;
            --accent: #6ea8fe;
            --accent-2: #7ef0c2;
            --shadow: 0 20px 50px rgba(0,0,0,0.35);
            --radius: 18px;
            --max: 1180px;
        }

        * {
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            margin: 0;
            font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            background:
                    radial-gradient(circle at top left, rgba(110,168,254,0.18), transparent 30%),
                    radial-gradient(circle at top right, rgba(126,240,194,0.12), transparent 30%),
                    linear-gradient(180deg, #09101d 0%, #0d1328 100%);
            color: var(--text);
            line-height: 1.6;
            background-color: #0b1020;
        }
    </style>
</head>
<body>

<div id="http-relationships-app" style="max-width:1200px; margin:0 auto; padding:20px 14px 40px; font-family:Inter, Segoe UI, Arial, sans-serif; background:#0f172a; color:#e5e7eb;">
    <div style="margin-bottom:20px; padding:22px 18px; border:1px solid rgba(255,255,255,0.08); border-radius:24px; background:linear-gradient(135deg, rgba(30,41,59,0.98), rgba(15,23,42,0.98)); box-shadow:0 18px 50px rgba(0,0,0,0.28);">
        <div style="display:inline-block; margin-bottom:10px; padding:6px 12px; border-radius:999px; background:rgba(96,165,250,0.16); color:#93c5fd; font-size:11px; font-weight:800; letter-spacing:.08em; text-transform:uppercase;">HTTP x Relationships</div>
        <h1 style="margin:0 0 10px; font-size:28px; line-height:1.15; color:#f8fafc;">Relationship Status Codes</h1>
        <p style="margin:0; font-size:15px; line-height:1.65; color:#94a3b8;">Dynamic, mobile-first version with generated cards, filters, search, and grouped sections. Same chaos, cleaner code.</p>
    </div>

    <div style="display:grid; grid-template-columns:1fr; gap:14px; margin-bottom:20px;">
        <div style="padding:16px; border-radius:20px; background:rgba(15,23,42,0.78); border:1px solid rgba(255,255,255,0.08); box-shadow:0 12px 30px rgba(0,0,0,0.22);">
            <label for="status-search" style="display:block; margin-bottom:8px; font-size:12px; font-weight:800; letter-spacing:.08em; text-transform:uppercase; color:#93c5fd;">Search</label>
            <input
                    id="status-search"
                    type="text"
                    placeholder="Search by code or name..."
                    style="width:100%; box-sizing:border-box; padding:14px 16px; border-radius:14px; border:1px solid rgba(255,255,255,0.10); background:rgba(255,255,255,0.05); color:#f8fafc; outline:none; font-size:14px;"
            />
        </div>

        <div style="padding:16px; border-radius:20px; background:rgba(15,23,42,0.78); border:1px solid rgba(255,255,255,0.08); box-shadow:0 12px 30px rgba(0,0,0,0.22);">
            <div style="margin-bottom:10px; font-size:12px; font-weight:800; letter-spacing:.08em; text-transform:uppercase; color:#93c5fd;">Filters</div>
            <div id="status-filters" style="display:flex; flex-wrap:wrap; gap:10px;"></div>
        </div>

        <div style="padding:16px; border-radius:20px; background:rgba(15,23,42,0.78); border:1px solid rgba(255,255,255,0.08); box-shadow:0 12px 30px rgba(0,0,0,0.22); display:grid; gap:14px;">
            <div>
                <label for="status-sort" style="display:block; margin-bottom:8px; font-size:12px; font-weight:800; letter-spacing:.08em; text-transform:uppercase; color:#93c5fd;">Sort</label>
                <select
                        id="status-sort"
                        style="width:100%; box-sizing:border-box; padding:14px 16px; border-radius:14px; border:1px solid rgba(255,255,255,0.10); background:rgba(255,255,255,0.05); color:#f8fafc; outline:none; font-size:14px;"
                >
                    <option value="code-asc">Code: ascending</option>
                    <option value="code-desc">Code: descending</option>
                    <option value="title-asc">Title: A–Z</option>
                    <option value="title-desc">Title: Z–A</option>
                </select>
            </div>

            <div style="display:flex; flex-wrap:wrap; gap:10px; align-items:center; justify-content:space-between;">
                <div id="active-filters-count" style="padding:10px 12px; border-radius:999px; background:rgba(255,255,255,0.05); border:1px solid rgba(255,255,255,0.08); font-size:12px; font-weight:700; color:#94a3b8;">
                    Active filters: 0
                </div>
                <button
                        id="status-reset"
                        type="button"
                        style="cursor:pointer; padding:12px 16px; border-radius:12px; border:1px solid rgba(255,255,255,0.12); background:rgba(255,255,255,0.06); color:#f8fafc; font-size:13px; font-weight:800; letter-spacing:.04em; text-transform:uppercase;"
                >
                    Reset filters
                </button>
            </div>
        </div>
    </div>

    <div id="status-summary" style="margin-bottom:18px; font-size:14px; color:#94a3b8;"></div>
    <div id="status-groups"></div>
    <p class="status" style="text-align: center; color: #1a2347">&copy; borowicz.github.io</div>
</div>

<script>
    (function () {
        const statuses = [
            { code: 100, group: '1xx', originalTitle: 'Continue', title: 'Still Loading My Life Choices', meaning: 'The initial part of the request has been received, and the client should continue.', description: 'Upload started. Coffee not finished yet.' },
            { code: 101, group: '1xx', originalTitle: 'Switching Protocols', title: 'Changed the Plan Again', meaning: 'The server is switching to a different protocol as requested.', description: 'HTTP said goodbye. WebSocket entered the chat.' },
            { code: 102, group: '1xx', originalTitle: 'Processing', title: 'Mentally Buffering', meaning: 'The server has received the request and is processing it, but no response is available yet.', description: 'Still thinking. Please do not poke the backend.' },
            { code: 103, group: '1xx', originalTitle: 'Early Hints', title: 'Tiny Signs of Hope', meaning: 'The server sends preliminary headers before the final response.', description: 'Here is a teaser while the real payload gets dressed.' },

            { code: 200, group: '2xx', originalTitle: 'OK', title: 'Surprisingly Doing Fine', meaning: 'The request succeeded.', description: 'It works in production. Nobody touch anything.' },
            { code: 201, group: '2xx', originalTitle: 'Created', title: 'Accidentally Started a New Chapter', meaning: 'The request succeeded and a new resource was created.', description: 'New record created. Future bug report scheduled.' },
            { code: 202, group: '2xx', originalTitle: 'Accepted', title: 'Fine, I’ll Deal With It', meaning: 'The request was accepted for processing, but it may not be completed yet.', description: 'Task accepted. See you after the queue finishes napping.' },
            { code: 204, group: '2xx', originalTitle: 'No Content', title: 'Nothing to Say, Just Existing', meaning: 'The request succeeded, but there is no content to return.', description: 'Everything is fine. There is just absolutely nothing to show.' },
            { code: 206, group: '2xx', originalTitle: 'Partial Content', title: 'Giving the Bare Minimum', meaning: 'The server is delivering only part of the requested resource.', description: 'Budget cut response. Full answer sold separately.' },

            { code: 300, group: '3xx', originalTitle: 'Multiple Choices', title: 'Too Many Options, Zero Clarity', meaning: 'The request has more than one possible response.', description: 'Three docs, four tutorials, zero certainty.' },
            { code: 301, group: '3xx', originalTitle: 'Moved Permanently', title: 'Left and Not Coming Back', meaning: 'The resource has been permanently moved to a new URL.', description: 'This endpoint has retired and moved to the countryside.' },
            { code: 302, group: '3xx', originalTitle: 'Found', title: 'Ended Up Somewhere Else', meaning: 'The resource resides temporarily under a different URL.', description: 'You found it, just not where the README promised.' },
            { code: 303, group: '3xx', originalTitle: 'See Other', title: 'Ask Somebody Else', meaning: 'The response can be found at another URL using GET.', description: 'Nice try. The useful thing is somewhere else.' },
            { code: 307, group: '3xx', originalTitle: 'Temporary Redirect', title: 'Detour Because Life Said So', meaning: 'The resource is temporarily available at a different URL, using the same method.', description: 'Detour ahead. Same request, different drama.' },
            { code: 308, group: '3xx', originalTitle: 'Permanent Redirect', title: 'New Direction, Same Problems', meaning: 'The resource has been permanently moved, and the same method should be used.', description: 'This route has committed to a new identity.' },

            { code: 400, group: '4xx', originalTitle: 'Bad Request', title: '400: That Made Sense in My Head', meaning: 'The server could not understand the request because it was invalid.', description: 'Your request spoke fluent nonsense.' },
            { code: 401, group: '4xx', originalTitle: 'Unauthorized', title: '401: Prove You Belong Here', meaning: 'Authentication is required and has failed or was not provided.', description: 'Nice request. Now show the token.' },
            { code: 403, group: '4xx', originalTitle: 'Forbidden', title: '403: Not Today', meaning: 'The server understood the request but refuses to authorize it.', description: 'Access denied by the firewall wizard.' },
            { code: 404, group: '4xx', originalTitle: 'Not Found', title: '404: Motivation Not Found', meaning: 'The server cannot find the requested resource.', description: 'The file escaped. The logs know nothing.' },
            { code: 408, group: '4xx', originalTitle: 'Request Timeout', title: '408: Took Too Long, Missed the Chance', meaning: 'The server timed out waiting for the request.', description: 'The server waited. Then it gave up on you.' },
            { code: 409, group: '4xx', originalTitle: 'Conflict', title: '409: My Plans and Reality Collided', meaning: 'The request conflicts with the current state of the resource.', description: 'Two truths entered. Git chose violence.' },
            { code: 410, group: '4xx', originalTitle: 'Gone', title: '410: That Phase Is Over', meaning: 'The resource is no longer available and will not be available again.', description: 'Deleted means deleted. Even hope was removed.' },
            { code: 411, group: '4xx', originalTitle: 'Length Required', title: '411: Please Explain Yourself', meaning: 'The server requires a valid Content-Length header.', description: 'Please specify the size of your chaos.' },
            { code: 422, group: '4xx', originalTitle: 'Unprocessable Entity', title: '422: Technically Fine, Emotionally Questionable', meaning: 'The server understands the request but cannot process the contained instructions.', description: 'Technically valid. Spiritually unacceptable.' },
            { code: 423, group: '4xx', originalTitle: 'Locked', title: '423: Closed Off for Maintenance', meaning: 'The resource that is being accessed is locked.', description: 'Resource is locked. Try again after the senior dev wakes up.' },
            { code: 429, group: '4xx', originalTitle: 'Too Many Requests', title: '429: Too Much, Too Fast', meaning: 'The user has sent too many requests in a given amount of time.', description: 'Rate limit activated. Touch grass and retry later.' },
            { code: 451, group: '4xx', originalTitle: 'Unavailable For Legal Reasons', title: '451: Life Said No', meaning: 'The resource is unavailable due to legal demands.', description: 'Content removed by people with better lawyers.' },

            { code: 500, group: '5xx', originalTitle: 'Internal Server Error', title: '500: I Am Having a Day', meaning: 'The server encountered an unexpected condition.', description: 'Everything exploded, but elegantly.' },
            { code: 501, group: '5xx', originalTitle: 'Not Implemented', title: '501: Not Ready for That Yet', meaning: 'The server does not support the functionality required to fulfill the request.', description: 'Roadmap says soon. Code says absolutely not.' },
            { code: 502, group: '5xx', originalTitle: 'Bad Gateway', title: '502: Wrong People, Wrong Timing', meaning: 'The server received an invalid response from an upstream server.', description: 'The proxy asked a question. Upstream replied with interpretive dance.' },
            { code: 503, group: '5xx', originalTitle: 'Service Unavailable', title: '503: Currently Unavailable to Everyone', meaning: 'The server is temporarily unable to handle the request.', description: 'Service unavailable. It is either overloaded or emotionally tired.' },
            { code: 504, group: '5xx', originalTitle: 'Gateway Timeout', title: '504: Waiting on Something That Will Never Happen', meaning: 'The server did not receive a timely response from an upstream server.', description: 'Timeout: somewhere, a server is still buffering with dignity.' },
            { code: 507, group: '5xx', originalTitle: 'Insufficient Storage', title: '507: No Space Left for More Problems', meaning: 'The server is unable to store the representation needed to complete the request.', description: 'No storage left. Delete memes or perish.' },
            { code: 508, group: '5xx', originalTitle: 'Loop Detected', title: '508: Same Mistake, Different Day', meaning: 'The server detected an infinite loop while processing the request.', description: 'The code entered a loop and found inner peace.' },
            { code: 510, group: '5xx', originalTitle: 'Not Extended', title: '510: Extra Energy Required', meaning: 'Further extensions to the request are required for the server to fulfill it.', description: 'Apparently this request needs DLC.' },
            { code: 511, group: '5xx', originalTitle: 'Network Authentication Required', title: '511: Trust Issues Detected', meaning: 'The client must authenticate to gain network access.', description: 'Before internet, please solve this captive portal side quest.' }
        ];

        const groupMeta = {
            '1xx': {
                label: 'Informational / Mixed Signals',
                tint: 'rgba(59,130,246,0.12)',
                tintSoft: 'rgba(59,130,246,0.09)',
                border: 'rgba(147,197,253,0.18)',
                badge: '#bfdbfe',
                code: '#dbeafe',
                text: '#cbd5e1'
            },
            '2xx': {
                label: 'Successful / It’s Complicated but Working',
                tint: 'rgba(34,197,94,0.12)',
                tintSoft: 'rgba(34,197,94,0.09)',
                border: 'rgba(187,247,208,0.18)',
                badge: '#bbf7d0',
                code: '#dcfce7',
                text: '#d1fae5'
            },
            '3xx': {
                label: 'Redirects / Looking Elsewhere',
                tint: 'rgba(250,204,21,0.12)',
                tintSoft: 'rgba(250,204,21,0.09)',
                border: 'rgba(253,230,138,0.18)',
                badge: '#fde68a',
                code: '#fef3c7',
                text: '#fef3c7'
            },
            '4xx': {
                label: 'Client Errors / Personal Failures',
                tint: 'rgba(248,113,113,0.12)',
                tintSoft: 'rgba(248,113,113,0.09)',
                border: 'rgba(254,202,202,0.18)',
                badge: '#fecaca',
                code: '#fee2e2',
                text: '#fee2e2'
            },
            '5xx': {
                label: 'Server Errors / Full Emotional Collapse',
                tint: 'rgba(168,85,247,0.12)',
                tintSoft: 'rgba(168,85,247,0.09)',
                border: 'rgba(233,213,255,0.18)',
                badge: '#e9d5ff',
                code: '#f3e8ff',
                text: '#f3e8ff'
            }
        };

        const orderedGroups = ['1xx', '2xx', '3xx', '4xx', '5xx'];
        const defaultSort = 'code-asc';
        let activeGroup = 'all';
        let searchTerm = '';
        let sortMode = defaultSort;

        const filtersEl = document.getElementById('status-filters');
        const searchEl = document.getElementById('status-search');
        const sortEl = document.getElementById('status-sort');
        const resetEl = document.getElementById('status-reset');
        const activeFiltersCountEl = document.getElementById('active-filters-count');
        const groupsEl = document.getElementById('status-groups');
        const summaryEl = document.getElementById('status-summary');

        function escapeHtml(value) {
            return String(value)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#39;');
        }

        function sortStatuses(items) {
            const sorted = [...items];

            sorted.sort((a, b) => {
                switch (sortMode) {
                    case 'code-desc':
                        return b.code - a.code;
                    case 'title-asc':
                        return a.title.localeCompare(b.title);
                    case 'title-desc':
                        return b.title.localeCompare(a.title);
                    case 'code-asc':
                    default:
                        return a.code - b.code;
                }
            });

            return sorted;
        }

        function getActiveFiltersCount() {
            let count = 0;
            if (activeGroup !== 'all') count += 1;
            if (searchTerm.trim()) count += 1;
            if (sortMode !== defaultSort) count += 1;
            return count;
        }

        function updateHash() {
            const params = new URLSearchParams();

            if (activeGroup !== 'all') {
                params.set('group', activeGroup);
            }

            if (searchTerm.trim()) {
                params.set('search', searchTerm.trim());
            }

            if (sortMode !== defaultSort) {
                params.set('sort', sortMode);
            }

            const newHash = params.toString();
            history.replaceState(null, '', newHash ? `#${newHash}` : '#');
        }

        function readHashState() {
            const rawHash = window.location.hash.replace(/^#/, '');
            const params = new URLSearchParams(rawHash);
            const hashGroup = params.get('group');
            const hashSearch = params.get('search');
            const hashSort = params.get('sort');

            if (hashGroup && ['all', ...orderedGroups].includes(hashGroup)) {
                activeGroup = hashGroup;
            }

            if (typeof hashSearch === 'string') {
                searchTerm = hashSearch;
            }

            if (hashSort && ['code-asc', 'code-desc', 'title-asc', 'title-desc'].includes(hashSort)) {
                sortMode = hashSort;
            }
        }

        function syncControls() {
            searchEl.value = searchTerm;
            sortEl.value = sortMode;
            activeFiltersCountEl.textContent = `Active filters: ${getActiveFiltersCount()}`;
        }

        function buildFilters() {
            const filterItems = ['all', ...orderedGroups];
            filtersEl.innerHTML = filterItems.map((item) => {
                const isActive = item === activeGroup;
                const meta = groupMeta[item] || null;
                const label = item === 'all' ? 'All' : item;
                const bg = isActive
                    ? 'rgba(96,165,250,0.20)'
                    : 'rgba(255,255,255,0.05)';
                const color = isActive
                    ? '#dbeafe'
                    : (meta ? meta.badge : '#cbd5e1');
                const border = isActive
                    ? 'rgba(147,197,253,0.45)'
                    : 'rgba(255,255,255,0.10)';

                return `
                <button
                    type="button"
                    data-filter="${escapeHtml(item)}"
                    style="cursor:pointer; padding:10px 14px; border-radius:999px; border:1px solid ${border}; background:${bg}; color:${color}; font-size:12px; font-weight:800; letter-spacing:.06em; text-transform:uppercase;">
                    ${escapeHtml(label)}
                </button>
            `;
            }).join('');

            filtersEl.querySelectorAll('[data-filter]').forEach((button) => {
                button.addEventListener('click', function () {
                    activeGroup = this.getAttribute('data-filter') || 'all';
                    render();
                });
            });
        }

        function getFilteredStatuses() {
            const term = searchTerm.trim().toLowerCase();

            return sortStatuses(statuses.filter((item) => {
                const matchesGroup = activeGroup === 'all' || item.group === activeGroup;
                const haystack = `${item.code} ${item.originalTitle} ${item.title} ${item.group} ${item.meaning} ${item.description}`.toLowerCase();
                const matchesSearch = !term || haystack.includes(term);
                return matchesGroup && matchesSearch;
            }));
        }

        function render() {
            syncControls();
            updateHash();
            buildFilters();

            const filtered = getFilteredStatuses();
            const grouped = orderedGroups.map((group) => ({
                group,
                items: filtered.filter((item) => item.group === group)
            })).filter((entry) => entry.items.length > 0);

            if (sortMode === 'code-desc' || sortMode === 'title-desc') {
                grouped.reverse();
            }

            summaryEl.innerHTML = filtered.length
                ? `Showing <strong style="color:#f8fafc;">${filtered.length}</strong> status code${filtered.length === 1 ? '' : 's'}${activeGroup !== 'all' ? ` in <strong style="color:#f8fafc;">${escapeHtml(activeGroup)}</strong>` : ''}${searchTerm.trim() ? ` matching <strong style="color:#f8fafc;">“${escapeHtml(searchTerm.trim())}”</strong>` : ''}.`
                : `No results${activeGroup !== 'all' ? ` in <strong style="color:#f8fafc;">${escapeHtml(activeGroup)}</strong>` : ''}${searchTerm.trim() ? ` for <strong style="color:#f8fafc;">“${escapeHtml(searchTerm.trim())}”</strong>` : ''}.`;

            if (!grouped.length) {
                groupsEl.innerHTML = `
                <div style="padding:26px 18px; border-radius:20px; border:1px solid rgba(255,255,255,0.08); background:rgba(15,23,42,0.78); color:#94a3b8; text-align:center;">
                    Nothing here. Relationship status: 404.
                </div>
            `;
                return;
            }

            groupsEl.innerHTML = grouped.map(({ group, items }) => {
                const meta = groupMeta[group];

                const cards = items.map((item, index) => {
                    const cardBackground = index % 2 === 0 ? meta.tint : meta.tintSoft;

                    return `
                    <div style="padding:18px; border-radius:20px; background:${cardBackground}; border:1px solid ${meta.border}; box-shadow:0 10px 24px rgba(0,0,0,0.12);">
                        <div style="display:flex; align-items:center; justify-content:space-between; gap:12px; margin-bottom:12px;">
                            <span style="font-size:28px; font-weight:900; line-height:1; color:${meta.code};">${escapeHtml(item.code)}</span>
                            <span style="padding:6px 10px; border-radius:999px; background:rgba(255,255,255,0.08); font-size:11px; font-weight:800; letter-spacing:.08em; text-transform:uppercase; color:${meta.badge};">${escapeHtml(item.group)}</span>
                        </div>
                        <div style="font-size:16px; color:${meta.text}; margin-bottom:6px; font-weight: bolder">${escapeHtml(item.originalTitle)}</div>
                        <div style="font-size:12px; color:${meta.text}; margin-bottom:6px;">${escapeHtml(item.meaning)}</div>
                        <div style="margin-bottom:8px; font-size:16px; font-weight:800; color:#f8fafc;">${escapeHtml(item.title)}</div>
                        <div style="font-size:14px; font-style: italic; line-height:1.6; color:${meta.text};">${escapeHtml(item.description)}</div>
                    </div>
                `;
                }).join('');

                return `
                <section style="margin-bottom:24px;">
                    <div style="display:flex; align-items:center; justify-content:space-between; gap:12px; margin-bottom:14px; flex-wrap:wrap;">
                        <div>
                            <div style="display:inline-block; margin-bottom:6px; padding:6px 10px; border-radius:999px; background:rgba(255,255,255,0.06); border:1px solid rgba(255,255,255,0.08); font-size:11px; font-weight:800; letter-spacing:.08em; text-transform:uppercase; color:${meta.badge};">${escapeHtml(group)}</div>
                            <h2 style="margin:0; font-size:20px; line-height:1.2; color:#f8fafc;">${escapeHtml(meta.label)}</h2>
                        </div>
                        <div style="padding:8px 12px; border-radius:999px; background:rgba(255,255,255,0.05); border:1px solid rgba(255,255,255,0.08); font-size:12px; font-weight:700; color:#94a3b8;">
                            ${items.length} item${items.length === 1 ? '' : 's'}
                        </div>
                    </div>
                    <div style="display:grid; grid-template-columns:repeat(auto-fit, minmax(260px, 1fr)); gap:14px;">
                        ${cards}
                    </div>
                </section>
            `;
            }).join('');
        }

        searchEl.addEventListener('input', function () {
            searchTerm = this.value || '';
            render();
        });

        sortEl.addEventListener('change', function () {
            sortMode = this.value || defaultSort;
            render();
        });

        resetEl.addEventListener('click', function () {
            activeGroup = 'all';
            searchTerm = '';
            sortMode = defaultSort;
            render();
        });

        window.addEventListener('hashchange', function () {
            activeGroup = 'all';
            searchTerm = '';
            sortMode = defaultSort;
            readHashState();
            render();
        });

        readHashState();
        render();
    })();
</script>

</body>
</html>
