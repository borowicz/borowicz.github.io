<!doctype html>
<html lang="pl">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Konwerter jednostek</title>
    <style>
        :root {
            --bg: #0b1020;
            --panel: rgba(18, 24, 46, .92);
            --panel2: rgba(255, 255, 255, .04);
            --border: rgba(255, 255, 255, .12);
            --text: #edf2ff;
            --muted: #97a3c6;
            --accent: #7c9cff;
            --accent2: #9c7cff;
            --good: #49c68a;
            --warn: #ffbf5e;
            --bad: #ff7d7d;
            --radius: 22px;
            --shadow: 0 22px 60px rgba(0, 0, 0, .35)
        }

        * {
            box-sizing: border-box
        }

        html, body {
            margin: 0;
            min-height: 100%;
            font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            color: var(--text);
            background: radial-gradient(circle at top left, rgba(124, 156, 255, .22), transparent 30%), radial-gradient(circle at top right, rgba(156, 124, 255, .18), transparent 28%), linear-gradient(180deg, #0a1020 0%, #10182b 100%)
        }

        body {
            padding: 24px
        }

        .page {
            width: min(1160px, 100%);
            margin: 0 auto;
            display: grid;
            gap: 18px
        }

        .hero, .card {
            border: 1px solid var(--border);
            border-radius: calc(var(--radius) + 4px);
            background: var(--panel);
            box-shadow: var(--shadow);
            overflow: hidden
        }

        .hero {
            padding: 28px;
            display: grid;
            grid-template-columns:1.15fr .85fr;
            gap: 18px;
            align-items: stretch
        }

        .eyebrow {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 8px 12px;
            border-radius: 999px;
            border: 1px solid var(--border);
            background: rgba(255, 255, 255, .04);
            color: var(--muted);
            font-size: 13px;
            letter-spacing: .04em;
            text-transform: uppercase;
            margin-bottom: 14px
        }

        h1 {
            margin: 0 0 10px;
            font-size: clamp(32px, 5vw, 52px);
            line-height: .98;
            letter-spacing: -.04em
        }

        .hero p {
            margin: 0;
            color: var(--muted);
            font-size: 16px;
            line-height: 1.7;
            max-width: 70ch
        }

        .hero-stats {
            display: grid;
            gap: 12px
        }

        .stat {
            border: 1px solid var(--border);
            border-radius: 18px;
            background: var(--panel2);
            padding: 16px
        }

        .stat strong {
            display: block;
            font-size: 26px;
            margin-bottom: 6px;
            letter-spacing: -.03em
        }

        .stat span {
            color: var(--muted);
            font-size: 14px;
            line-height: 1.55
        }

        .layout {
            display: grid;
            grid-template-columns:1fr 1fr;
            gap: 18px
        }

        .card-header {
            padding: 18px 20px;
            border-bottom: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            gap: 12px;
            align-items: center
        }

        .card-header h2 {
            margin: 0;
            font-size: 19px
        }

        .card-header span, .muted {
            color: var(--muted);
            font-size: 13px
        }

        .card-body {
            padding: 20px
        }

        .form-grid {
            display: grid;
            grid-template-columns:repeat(2, minmax(0, 1fr));
            gap: 14px
        }

        .field {
            display: grid;
            gap: 8px
        }

        .field.full {
            grid-column: 1/-1
        }

        label {
            font-size: 14px;
            color: var(--muted)
        }

        input, select, button, textarea {
            font: inherit
        }

        input, select, textarea {
            width: 100%;
            min-height: 52px;
            border-radius: 16px;
            border: 1px solid var(--border);
            background: rgba(255, 255, 255, .04);
            color: var(--text);
            padding: 12px 14px;
            outline: none
        }

        textarea {
            min-height: 220px;
            resize: vertical
        }

        input:focus, select:focus, textarea:focus {
            border-color: rgba(124, 156, 255, .65);
            box-shadow: 0 0 0 4px rgba(124, 156, 255, .08)
        }

        .actions {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin-top: 18px
        }

        .btn {
            min-height: 48px;
            padding: 0 16px;
            border-radius: 16px;
            border: 1px solid var(--border);
            background: rgba(255, 255, 255, .05);
            color: var(--text);
            cursor: pointer;
            transition: .2s ease
        }

        .btn:hover {
            background: rgba(255, 255, 255, .08);
            transform: translateY(-1px)
        }

        .btn.primary {
            background: linear-gradient(135deg, rgba(124, 156, 255, .95), rgba(156, 124, 255, .95));
            border-color: transparent
        }

        .result-main {
            border: 1px solid var(--border);
            border-radius: 20px;
            padding: 18px;
            background: linear-gradient(180deg, rgba(255, 255, 255, .06), rgba(255, 255, 255, .03))
        }

        .result-main strong {
            display: block;
            font-size: clamp(28px, 5vw, 44px);
            line-height: 1;
            letter-spacing: -.04em;
            margin-bottom: 8px
        }

        .result-main p {
            margin: 0;
            color: var(--muted);
            line-height: 1.65
        }

        .details-grid {
            display: grid;
            grid-template-columns:repeat(3, minmax(0, 1fr));
            gap: 12px
        }

        .detail {
            border: 1px solid var(--border);
            border-radius: 16px;
            background: rgba(255, 255, 255, .04);
            padding: 14px
        }

        .detail strong {
            display: block;
            font-size: 20px;
            margin-bottom: 5px
        }

        .detail span {
            color: var(--muted);
            font-size: 13px;
            line-height: 1.5
        }

        .two-panels {
            display: grid;
            grid-template-columns:1fr 1fr;
            gap: 12px
        }

        .output {
            white-space: pre-wrap;
            word-break: break-word
        }

        .pill {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            min-height: 36px;
            padding: 0 12px;
            border-radius: 999px;
            border: 1px solid var(--border);
            background: rgba(255, 255, 255, .04);
            font-size: 14px
        }

        .good {
            color: var(--good)
        }

        .warn {
            color: var(--warn)
        }

        .bad {
            color: var(--bad)
        }

        table {
            width: 100%;
            border-collapse: collapse
        }

        th, td {
            border: 1px solid var(--border);
            padding: 10px;
            text-align: left;
            vertical-align: top
        }

        th {
            background: rgba(255, 255, 255, .04)
        }

        .swatches {
            display: grid;
            grid-template-columns:repeat(5, minmax(0, 1fr));
            gap: 12px
        }

        .swatch {
            border-radius: 18px;
            overflow: hidden;
            border: 1px solid var(--border)
        }

        .swatch-color {
            height: 90px
        }

        .swatch-meta {
            padding: 10px;
            font-size: 13px;
            color: var(--muted)
        }

        .mono {
            font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace
        }

        .note {
            margin-top: 14px;
            padding: 14px;
            border-radius: 16px;
            border: 1px solid var(--border);
            background: rgba(255, 255, 255, .04);
            color: var(--muted);
            line-height: 1.65;
            font-size: 14px
        }

        @media (max-width: 980px) {
            .hero, .layout, .two-panels {
                grid-template-columns:1fr
            }

            .details-grid, .form-grid, .swatches {
                grid-template-columns:1fr 1fr
            }
        }

        @media (max-width: 640px) {
            body {
                padding: 14px
            }

            .hero, .card-body {
                padding: 16px
            }

            .form-grid, .details-grid, .swatches {
                grid-template-columns:1fr
            }
        }
    </style>
</head>
<body>
<div class="page">
    <section class="hero">
        <div>
            <div class="eyebrow">📏 <a href="/" style="color:#ccc">github.io html / css / js</a></div>
            <h1>Konwerter jednostek</h1>
            <p>Konwersja długości, masy, temperatury i prędkości w jednej statycznej stronie.</p>
        </div>
        <div class="hero-stats">
            <div class="stat"><strong id="heroCategory">Długość</strong><span>Aktualna kategoria konwersji.</span></div>
            <div class="stat"><strong id="heroValue">—</strong><span>Przeliczona wartość.</span></div>
        </div>
    </section>

    <section class="layout">
        <article class="card">
            <div class="card-header"><h2>Wejście</h2><span>Kategoria i jednostki</span></div>
            <div class="card-body">
                <div class="form-grid">
                    <div class="field"><label for="category">Kategoria</label><select id="category"></select></div>
                    <div class="field"><label for="valueIn">Wartość</label><input id="valueIn" type="number" value="1"
                                                                                  step="0.01"></div>
                    <div class="field"><label for="fromUnit">Z</label><select id="fromUnit"></select></div>
                    <div class="field"><label for="toUnit">Na</label><select id="toUnit"></select></div>
                </div>
                <div class="actions">
                    <button class="btn primary" id="convertBtn">Przelicz</button>
                </div>
            </div>
        </article>
        <article class="card">
            <div class="card-header"><h2>Wynik</h2><span>Konwersja</span></div>
            <div class="card-body">
                <div class="result-main"><strong id="outValue">—</strong>
                    <p id="outDesc">Wybierz kategorię i jednostki.</p></div>
            </div>
        </article>
    </section>

    <div class="footer">
        <p style="text-align: center; color: #1a2347">&copy; <a style="color: #cccc;" href="./../" title="borowicz.github.io">borowicz.github.io</a>
    </div>
</div>
<script>
    const defs = {
        length: {label: 'Długość', units: {m: 1, km: 1000, cm: 0.01, mm: 0.001, mi: 1609.344, ft: 0.3048}},
        mass: {label: 'Masa', units: {kg: 1, g: 0.001, lb: 0.45359237, oz: 0.028349523125}},
        speed: {label: 'Prędkość', units: {'m/s': 1, 'km/h': 0.2777777778, mph: 0.44704}},
        temp: {label: 'Temperatura', units: ['C', 'F', 'K']}
    };

    function fillCats() {
        category.innerHTML = Object.entries(defs).map(([k, v]) => `<option value="${k}">${v.label}</option>`).join('');
    }

    function fillUnits() {
        const def = defs[category.value];
        if (Array.isArray(def.units)) {
            fromUnit.innerHTML = toUnit.innerHTML = def.units.map(u => `<option value="${u}">${u}</option>`).join('');
            toUnit.value = def.units[1] || def.units[0];
        } else {
            const opts = Object.keys(def.units).map(u => `<option value="${u}">${u}</option>`).join('');
            fromUnit.innerHTML = toUnit.innerHTML = opts;
            const keys = Object.keys(def.units);
            toUnit.value = keys[1] || keys[0];
        }
        heroCategory.textContent = def.label;
    }

    function convert() {
        const v = Number(valueIn.value) || 0, cat = category.value;
        let res = 0;
        if (cat === 'temp') {
            if (fromUnit.value === 'C') res = toUnit.value === 'F' ? v * 9 / 5 + 32 : toUnit.value === 'K' ? v + 273.15 : v;
            if (fromUnit.value === 'F') res = toUnit.value === 'C' ? (v - 32) * 5 / 9 : toUnit.value === 'K' ? (v - 32) * 5 / 9 + 273.15 : v;
            if (fromUnit.value === 'K') res = toUnit.value === 'C' ? v - 273.15 : toUnit.value === 'F' ? (v - 273.15) * 9 / 5 + 32 : v;
        } else {
            const base = v * defs[cat].units[fromUnit.value];
            res = base / defs[cat].units[toUnit.value];
        }
        outValue.textContent = `${formatNumber(res, 6)} ${toUnit.value}`;
        outDesc.textContent = `${formatNumber(v, 6)} ${fromUnit.value} = ${formatNumber(res, 6)} ${toUnit.value}`;
        heroValue.textContent = outValue.textContent;
    }

    fillCats();
    fillUnits();
    category.onchange = fillUnits;
    convertBtn.onclick = convert;
    convert();
</script>
</body>
</html>
