

<!doctype html>
<html lang="pl" data-lang="pl">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Fullscreen Calendar</title>
    <style>
        :root {
            --bg: #0b1020;
            --bg-elev: rgba(18, 24, 46, 0.92);
            --panel: rgba(255, 255, 255, 0.06);
            --panel-strong: rgba(255, 255, 255, 0.1);
            --border: rgba(255, 255, 255, 0.12);
            --text: #edf2ff;
            --muted: #9aa6c7;
            --accent: #7c9cff;
            --accent-2: #9c7cff;
            --today: rgba(124, 156, 255, 0.2);
            --shadow: 0 20px 60px rgba(0, 0, 0, 0.35);
            --radius: 18px;
            --header-h: 84px;
            --sidebar-w: 320px;
            --control-h: 44px;
        }

        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            min-height: 100%;
            font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            color: var(--text);
            background:
                radial-gradient(circle at top left, rgba(124, 156, 255, 0.22), transparent 32%),
                radial-gradient(circle at top right, rgba(156, 124, 255, 0.18), transparent 30%),
                linear-gradient(180deg, #0b1020 0%, #0d1328 100%);
        }

        body {
            min-height: 100vh;
        }

        button,
        select,
        input {
            font: inherit;
        }

        .app {
            min-height: 100vh;
            display: grid;
            grid-template-rows: var(--header-h) 1fr;
        }

        .topbar {
            position: sticky;
            top: 0;
            z-index: 30;
            display: grid;
            grid-template-columns: auto 1fr auto;
            align-items: center;
            gap: 1rem;
            padding: 1rem 1.25rem;
            backdrop-filter: blur(16px);
            background: rgba(11, 16, 32, 0.72);
            border-bottom: 1px solid var(--border);
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 0.85rem;
            min-width: 0;
        }

        .logo {
            width: 42px;
            height: 42px;
            border-radius: 14px;
            display: grid;
            place-items: center;
            background: linear-gradient(135deg, var(--accent), var(--accent-2));
            box-shadow: var(--shadow);
            font-size: 1.2rem;
        }

        .brand-copy {
            min-width: 0;
        }

        .eyebrow {
            margin: 0;
            color: var(--muted);
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.14em;
        }

        .brand h1 {
            margin: 0.15rem 0 0;
            font-size: 1.1rem;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .toolbar {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 0.65rem;
        }

        .toolbar-group {
            display: inline-flex;
            align-items: center;
            gap: 0.35rem;
            padding: 0.35rem;
            border-radius: 999px;
            background: var(--panel);
            border: 1px solid var(--border);
        }

        .btn,
        .view-btn,
        .chip-btn {
            border: 0;
            color: var(--text);
            background: transparent;
            cursor: pointer;
            border-radius: 999px;
            transition: 0.2s ease;
        }

        .btn {
            padding: 0.72rem 1rem;
        }

        .btn:hover,
        .view-btn:hover,
        .chip-btn:hover {
            background: rgba(255, 255, 255, 0.08);
        }

        .btn.primary,
        .view-btn.active,
        .chip-btn.active {
            background: linear-gradient(135deg, rgba(124, 156, 255, 0.95), rgba(156, 124, 255, 0.95));
            color: white;
            box-shadow: 0 10px 28px rgba(124, 156, 255, 0.28);
        }

        .view-btn {
            padding: 0.72rem 0.95rem;
            font-size: 0.95rem;
        }

        .actions {
            display: flex;
            align-items: center;
            gap: 0.65rem;
            justify-content: flex-end;
            flex-wrap: wrap;
        }

        .today-btn {
            border: 1px solid var(--border);
            background: var(--panel);
        }

        .lang-switcher {
            display: inline-flex;
            align-items: center;
            gap: 0.35rem;
            padding: 0.3rem;
            border-radius: 999px;
            border: 1px solid var(--border);
            background: var(--panel);
        }

        .lang-btn {
            min-width: 52px;
            height: var(--control-h);
            padding: 0 0.9rem;
            border: 0;
            border-radius: 999px;
            background: transparent;
            color: var(--text);
            cursor: pointer;
            transition: 0.2s ease;
            font-weight: 600;
        }

        .lang-btn:hover {
            background: rgba(255, 255, 255, 0.08);
        }

        .lang-btn.active {
            background: linear-gradient(135deg, rgba(124, 156, 255, 0.95), rgba(156, 124, 255, 0.95));
            color: #fff;
            box-shadow: 0 10px 28px rgba(124, 156, 255, 0.28);
        }

        .shell {
            min-height: calc(100vh - var(--header-h));
            display: grid;
            grid-template-columns: var(--sidebar-w) minmax(0, 1fr);
            gap: 1rem;
            padding: 1rem;
        }

        .sidebar,
        .content-panel {
            border: 1px solid var(--border);
            background: var(--bg-elev);
            backdrop-filter: blur(16px);
            border-radius: calc(var(--radius) + 6px);
            box-shadow: var(--shadow);
            overflow: hidden;
        }

        .sidebar {
            display: flex;
            flex-direction: column;
        }

        .sidebar-section {
            padding: 1.1rem 1.1rem 0;
        }

        .month-card {
            margin: 1.1rem;
            margin-bottom: 0.8rem;
            padding: 1rem;
            border-radius: var(--radius);
            background: linear-gradient(180deg, rgba(255, 255, 255, 0.08), rgba(255, 255, 255, 0.04));
            border: 1px solid var(--border);
        }

        .month-card h2,
        .month-card p {
            margin: 0;
        }

        .month-card h2 {
            font-size: 1.25rem;
            margin-bottom: 0.25rem;
        }

        .month-card p {
            color: var(--muted);
        }

        .mini-grid {
            display: grid;
            grid-template-columns: repeat(7, minmax(0, 1fr));
            gap: 0.35rem;
            padding: 0 1.1rem 1.2rem;
        }

        .mini-dow,
        .mini-day {
            aspect-ratio: 1;
            border-radius: 12px;
            display: grid;
            place-items: center;
            font-size: 0.78rem;
        }

        .mini-dow {
            color: var(--muted);
        }

        .mini-day {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid transparent;
        }

        .mini-day.muted {
            color: rgba(255, 255, 255, 0.35);
        }

        .mini-day.today {
            background: var(--today);
            border-color: rgba(124, 156, 255, 0.65);
        }

        .mini-day.has-holiday,
        .year-mini span.has-holiday,
        .day-cell.has-holiday .day-number,
        .week-row .dow-cell.has-holiday,
        .week-cell.has-holiday {
            box-shadow: inset 0 0 0 1px rgba(255, 209, 102, 0.65);
        }

        .day-cell.has-holiday .day-number {
            background: rgba(255, 209, 102, 0.14);
        }

        .day-cell.today.has-holiday .day-number {
            background: linear-gradient(135deg, var(--accent), var(--accent-2));
            box-shadow: 0 0 0 2px rgba(255, 209, 102, 0.55);
        }

        .quick-jump,
        .legend {
            padding: 0 1.1rem 1.1rem;
        }

        .quick-jump label,
        .legend h3,
        .agenda h3 {
            display: block;
            margin: 0 0 0.6rem;
            font-size: 0.86rem;
            color: var(--muted);
            text-transform: uppercase;
            letter-spacing: 0.08em;
        }

        .quick-jump input {
            width: 100%;
            border: 1px solid var(--border);
            background: rgba(255, 255, 255, 0.04);
            color: var(--text);
            border-radius: 14px;
            padding: 0.9rem 1rem;
            outline: none;
        }

        .legend-list,
        .agenda-list {
            display: grid;
            gap: 0.65rem;
        }

        .legend-item,
        .agenda-item {
            border: 1px solid var(--border);
            background: rgba(255, 255, 255, 0.04);
            border-radius: 16px;
            padding: 0.9rem 1rem;
        }

        .legend-row {
            display: flex;
            align-items: center;
            gap: 0.65rem;
        }

        .dot {
            width: 10px;
            height: 10px;
            border-radius: 999px;
            background: var(--accent);
            box-shadow: 0 0 0 5px rgba(124, 156, 255, 0.14);
            flex: 0 0 auto;
        }

        .agenda-item strong,
        .legend-item strong {
            display: block;
        }

        .agenda-item small,
        .legend-item small,
        .list-card small,
        .year-card small,
        .month-event small,
        .week-event small {
            color: var(--muted);
        }

        .content-panel {
            display: flex;
            flex-direction: column;
            min-height: 0;
        }

        .content-header {
            padding: 1rem 1.2rem;
            border-bottom: 1px solid var(--border);
            display: grid;
            grid-template-columns: auto 1fr auto;
            align-items: center;
            gap: 1rem;
        }

        .nav-buttons {
            display: inline-flex;
            gap: 0.5rem;
        }

        .icon-btn {
            width: 44px;
            height: 44px;
            border-radius: 14px;
            border: 1px solid var(--border);
            background: rgba(255, 255, 255, 0.05);
            color: var(--text);
            cursor: pointer;
            transition: 0.2s ease;
        }

        .icon-btn:hover {
            background: rgba(255, 255, 255, 0.09);
        }

        .title-wrap h2,
        .title-wrap p {
            margin: 0;
        }

        .title-wrap h2 {
            font-size: clamp(1.2rem, 2vw, 1.8rem);
        }

        .title-wrap p {
            color: var(--muted);
            margin-top: 0.25rem;
        }

        .view-root {
            min-height: 0;
            flex: 1;
            overflow: auto;
        }

        .calendar-grid {
            height: 100%;
            display: grid;
        }

        .month-view {
            grid-template-rows: auto 1fr;
        }

        .dow-row,
        .week-row,
        .month-grid,
        .week-grid,
        .year-grid,
        .list-grid,
        .century-grid,
        .decade-grid {
            display: grid;
        }

        .dow-row {
            grid-template-columns: repeat(7, minmax(0, 1fr));
            border-bottom: 1px solid var(--border);
            position: sticky;
            top: 0;
            z-index: 5;
            background: rgba(11, 16, 32, 0.94);
            backdrop-filter: blur(8px);
        }

        .dow-cell {
            padding: 0.95rem;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            color: var(--muted);
            font-size: 0.75rem;
            border-right: 1px solid var(--border);
        }

        .dow-cell:last-child {
            border-right: 0;
        }

        .month-grid {
            grid-template-columns: repeat(7, minmax(0, 1fr));
            grid-auto-rows: minmax(140px, 1fr);
        }

        .day-cell {
            border-right: 1px solid var(--border);
            border-bottom: 1px solid var(--border);
            padding: 0.8rem;
            display: flex;
            flex-direction: column;
            gap: 0.65rem;
            min-width: 0;
            background: rgba(255, 255, 255, 0.02);
        }

        .day-cell.muted {
            background: rgba(255, 255, 255, 0.01);
            color: rgba(255, 255, 255, 0.52);
        }

        .day-cell.today {
            background: linear-gradient(180deg, rgba(124, 156, 255, 0.14), rgba(124, 156, 255, 0.06));
        }

        .day-head {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 0.5rem;
        }

        .day-number {
            width: 34px;
            height: 34px;
            border-radius: 999px;
            display: grid;
            place-items: center;
            font-weight: 700;
        }

        .day-cell.today .day-number {
            background: linear-gradient(135deg, var(--accent), var(--accent-2));
        }

        .event-list {
            display: grid;
            gap: 0.45rem;
            min-width: 0;
        }

        .event-pill,
        .month-event,
        .week-event,
        .year-card,
        .list-card {
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid var(--border);
            border-radius: 14px;
        }

        .event-pill {
            padding: 0.45rem 0.55rem;
            font-size: 0.78rem;
            min-width: 0;
        }

        .event-pill strong {
            display: block;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .event-pill.holiday-pill,
        .week-holiday-pill,
        .holiday-summary-item {
            border-color: rgba(255, 209, 102, 0.35);
            background: rgba(255, 209, 102, 0.12);
        }

        .week-holiday-pill {
            margin-top: 0.45rem;
            padding: 0.45rem 0.55rem;
            font-size: 0.76rem;
            border-radius: 14px;
        }

        .holiday-summary {
            margin: 1rem;
            margin-bottom: 0;
            padding: 1rem;
            border: 1px solid var(--border);
            border-radius: 18px;
            background: rgba(255, 255, 255, 0.04);
        }

        .holiday-summary h3 {
            margin: 0 0 0.85rem;
            font-size: 0.95rem;
            color: var(--text);
        }

        .holiday-summary-list {
            display: grid;
            gap: 0.6rem;
        }

        .holiday-summary-item {
            padding: 0.75rem 0.9rem;
            border: 1px solid var(--border);
            border-radius: 14px;
        }

        .holiday-summary-item strong {
            display: block;
            margin-bottom: 0.2rem;
        }

        .holiday-summary-item small {
            color: var(--muted);
        }

        .week-view {
            display: grid;
            grid-template-rows: auto 1fr;
            min-height: 100%;
        }

        .week-row {
            grid-template-columns: 88px repeat(7, minmax(0, 1fr));
            border-bottom: 1px solid var(--border);
            position: sticky;
            top: 0;
            z-index: 5;
            background: rgba(11, 16, 32, 0.95);
        }

        .week-row .dow-cell {
            border-right: 1px solid var(--border);
            min-height: 72px;
        }

        .week-row .dow-cell:first-child {
            color: transparent;
        }

        .week-grid {
            grid-template-columns: 88px repeat(7, minmax(0, 1fr));
            grid-auto-rows: 88px;
        }

        .time-cell,
        .week-cell {
            border-right: 1px solid var(--border);
            border-bottom: 1px solid var(--border);
            padding: 0.65rem;
        }

        .time-cell {
            color: var(--muted);
            font-size: 0.85rem;
            background: rgba(255, 255, 255, 0.02);
        }

        .week-cell.today {
            background: rgba(124, 156, 255, 0.05);
        }

        .week-event {
            padding: 0.5rem 0.6rem;
            font-size: 0.78rem;
            margin-bottom: 0.45rem;
        }

        .year-view,
        .list-view,
        .century-view,
        .decade-view {
            padding: 1rem;
        }

        .year-grid {
            grid-template-columns: repeat(4, minmax(0, 1fr));
            gap: 1rem;
        }

        .year-card {
            padding: 0.9rem;
            display: grid;
            gap: 0.75rem;
        }

        .year-mini {
            display: grid;
            grid-template-columns: repeat(7, minmax(0, 1fr));
            gap: 0.2rem;
        }

        .year-mini span {
            aspect-ratio: 1;
            border-radius: 8px;
            background: rgba(255, 255, 255, 0.05);
            display: grid;
            place-items: center;
            font-size: 0.58rem;
        }

        .year-mini span.today {
            background: var(--today);
            outline: 1px solid rgba(124, 156, 255, 0.6);
        }

        .list-grid,
        .century-grid,
        .decade-grid {
            gap: 1rem;
        }

        .list-card {
            padding: 1rem;
            display: grid;
            gap: 0.8rem;
        }

        .list-card-header {
            display: flex;
            justify-content: space-between;
            gap: 1rem;
            flex-wrap: wrap;
        }

        .chip-row {
            display: flex;
            flex-wrap: wrap;
            gap: 0.45rem;
        }

        .chip-btn {
            padding: 0.55rem 0.8rem;
            border: 1px solid var(--border);
            background: rgba(255, 255, 255, 0.04);
        }

        .metric-row {
            display: grid;
            grid-template-columns: repeat(3, minmax(0, 1fr));
            gap: 0.7rem;
        }

        .metric {
            padding: 0.85rem;
            border-radius: 14px;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid var(--border);
        }

        .metric strong {
            display: block;
            font-size: 1.15rem;
            margin-top: 0.35rem;
        }

        .period-card {
            border: 1px solid var(--border);
            border-radius: 20px;
            background: rgba(255, 255, 255, 0.04);
            padding: 1rem;
            display: grid;
            gap: 0.9rem;
        }

        .period-card header {
            display: flex;
            justify-content: space-between;
            gap: 1rem;
            flex-wrap: wrap;
            align-items: baseline;
        }

        .period-title {
            margin: 0;
            font-size: 1.15rem;
        }

        .period-subtitle {
            margin: 0.25rem 0 0;
            color: var(--muted);
        }

        .period-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 0.75rem;
        }

        .empty-state {
            padding: 2rem;
            color: var(--muted);
        }

        @media (max-width: 1180px) {
            .shell {
                grid-template-columns: 1fr;
            }

            .sidebar {
                order: 2;
            }

            .content-panel {
                order: 1;
                min-height: 70vh;
            }

            .year-grid {
                grid-template-columns: repeat(3, minmax(0, 1fr));
            }
        }

        @media (max-width: 900px) {
            .topbar {
                grid-template-columns: 1fr;
                justify-items: stretch;
            }

            .toolbar,
            .actions {
                justify-content: flex-start;
            }

            .content-header {
                grid-template-columns: 1fr;
                align-items: start;
            }

            .month-grid {
                grid-auto-rows: minmax(120px, 1fr);
            }

            .year-grid {
                grid-template-columns: repeat(2, minmax(0, 1fr));
            }
        }

        @media (max-width: 720px) {
            .shell {
                padding: 0.75rem;
            }

            .toolbar {
                justify-content: flex-start;
            }

            .toolbar-group {
                width: 100%;
                justify-content: flex-start;
                overflow-x: auto;
                scrollbar-width: none;
            }

            .toolbar-group::-webkit-scrollbar {
                display: none;
            }

            .view-btn {
                white-space: nowrap;
            }

            .month-grid,
            .dow-row {
                min-width: 760px;
            }

            .week-row,
            .week-grid {
                min-width: 920px;
            }

            .year-grid {
                grid-template-columns: 1fr;
            }

            .metric-row {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
<div class="app" id="app">
    <header class="topbar">
        <div class="brand">
            <div class="logo">🗓️</div>
            <div class="brand-copy">
                <p class="eyebrow">github.io html/js</p>
                <h1>Kalendarz pełnoekranowy</h1>
            </div>
        </div>

        <div class="toolbar">
            <div class="toolbar-group" id="viewSwitcher"></div>
        </div>

        <div class="actions">
            <div class="lang-switcher" id="langSwitcher" aria-label="Language switcher">
                <button class="lang-btn active" type="button" data-lang="pl">PL</button>
                <button class="lang-btn" type="button" data-lang="en">EN</button>
                <button class="lang-btn" type="button" data-lang="de">DE</button>
            </div>
            <button class="btn today-btn" id="todayBtn" type="button">Dziś</button>
            <button class="btn today-btn" id="holidayToggleBtn" type="button">Święta w widoku</button>
        </div>
    </header>

    <main class="shell">
        <aside class="sidebar">
            <section class="month-card">
                <p class="eyebrow" data-i18n="miniPreview">Mini preview</p>
                <h2 id="miniMonthLabel">—</h2>
                <p id="miniMonthMeta">—</p>
            </section>

            <section class="mini-grid" id="miniCalendar"></section>

            <section class="quick-jump">
                <label for="jumpInput" data-i18n="jumpToDate">Skok do daty</label>
                <input id="jumpInput" type="month">
            </section>

            <section class="legend">
                <h3 data-i18n="legend">Legenda</h3>
                <div class="legend-list">
                    <article class="legend-item">
                        <div class="legend-row">
                            <span class="dot"></span>
                            <div>
                                <strong data-i18n="todayLabel">Dziś</strong>
                                <small data-i18n="todayLegend">Podświetlony dzień odniesienia.</small>
                            </div>
                        </div>
                    </article>
                    <article class="legend-item">
                        <div class="legend-row">
                            <span class="dot" style="background:#94a3b8; box-shadow:0 0 0 5px rgba(148,163,184,0.12)"></span>
                            <div>
                                <strong data-i18n="outsideRange">Dni spoza zakresu</strong>
                                <small data-i18n="outsideRangeLegend">Widoczne dla pełnej siatki miesiąca.</small>
                            </div>
                        </div>
                    </article>
                </div>
            </section>

            <section class="agenda sidebar-section">
                <h3 data-i18n="sampleAgenda">Przykładowa agenda</h3>
                <div class="agenda-list" id="agendaList"></div>
            </section>
        </aside>

        <section class="content-panel">
            <div class="content-header">
                <div class="nav-buttons">
                    <button class="icon-btn" id="prevBtn" type="button" aria-label="Poprzedni widok">←</button>
                    <button class="icon-btn" id="nextBtn" type="button" aria-label="Następny widok">→</button>
                </div>

                <div class="title-wrap">
                    <h2 id="viewTitle">—</h2>
                    <p id="viewSubtitle">—</p>
                </div>

                <div class="chip-row" id="rangeChips"></div>
            </div>

            <div class="view-root" id="viewRoot"></div>
        </section>
    </main>
</div>

        const holidayIndex = buildHolidayIndex(holidayCalendarData);

        const state = {
            currentView: 'year',
            anchorDate: startOfDay(new Date()),
            today: startOfDay(new Date()),
            currentLang: 'pl',
            showHolidayList: false
        };

        const sampleEvents = generateSampleEvents();

        const els = {
            viewSwitcher: document.getElementById('viewSwitcher'),
            viewRoot: document.getElementById('viewRoot'),
            viewTitle: document.getElementById('viewTitle'),
            viewSubtitle: document.getElementById('viewSubtitle'),
            miniMonthLabel: document.getElementById('miniMonthLabel'),
            miniMonthMeta: document.getElementById('miniMonthMeta'),
            miniCalendar: document.getElementById('miniCalendar'),
            agendaList: document.getElementById('agendaList'),
            rangeChips: document.getElementById('rangeChips'),
            jumpInput: document.getElementById('jumpInput'),
            todayBtn: document.getElementById('todayBtn'),
            prevBtn: document.getElementById('prevBtn'),
            nextBtn: document.getElementById('nextBtn'),
            langSwitcher: document.getElementById('langSwitcher'),
            holidayToggleBtn: document.getElementById('holidayToggleBtn')
        };

        init();

        function init() {
            bindEvents();
            applyStaticTranslations();
            render();
        }

        function bindEvents() {
            els.todayBtn.addEventListener('click', () => {
                state.anchorDate = startOfDay(new Date());
                render();
            });

            els.prevBtn.addEventListener('click', () => {
                shiftRange(-1);
                render();
            });

            els.nextBtn.addEventListener('click', () => {
                shiftRange(1);
                render();
            });

            els.jumpInput.addEventListener('change', (event) => {
                if (!event.target.value) return;
                const [year, month] = event.target.value.split('-').map(Number);
                state.anchorDate = new Date(year, month - 1, 1);
                render();
            });

            els.langSwitcher.querySelectorAll('[data-lang]').forEach((button) => {
                button.addEventListener('click', () => {
                    state.currentLang = button.dataset.lang;
                    currentLang = state.currentLang;
                    document.documentElement.lang = i18n[currentLang].htmlLang;
                    document.documentElement.dataset.lang = currentLang;
                    applyStaticTranslations();
                    updateLanguageButtons();
                    render();
                });
            });

            els.holidayToggleBtn.addEventListener('click', () => {
                state.showHolidayList = !state.showHolidayList;
                render();
            });
        }

        function applyStaticTranslations() {
            document.title = t('appTitle');
            document.querySelector('.brand h1').textContent = t('appTitle');
            document.querySelector('.brand .eyebrow').textContent = t('eyebrow');
            document.getElementById('todayBtn').textContent = t('todayButton');
            document.getElementById('holidayToggleBtn').textContent = t('holidayToggle');

            document.querySelectorAll('[data-i18n]').forEach((node) => {
                const key = node.dataset.i18n;
                node.textContent = t(key);
            });
        }

        function updateLanguageButtons() {
            els.langSwitcher.querySelectorAll('[data-lang]').forEach((button) => {
                button.classList.toggle('active', button.dataset.lang === currentLang);
            });
        }

        function getCurrentViewRange() {
            const anchor = state.anchorDate;

            switch (state.currentView) {
                case 'week': {
                    const start = startOfWeek(anchor);
                    return { start, end: addDays(start, 6) };
                }
                case 'month': {
                    return {
                        start: new Date(anchor.getFullYear(), anchor.getMonth(), 1),
                        end: new Date(anchor.getFullYear(), anchor.getMonth() + 1, 0)
                    };
                }
                case 'year': {
                    return {
                        start: new Date(anchor.getFullYear(), 0, 1),
                        end: new Date(anchor.getFullYear(), 11, 31)
                    };
                }
                case 'decade-list': {
                    const decadeStart = Math.floor(anchor.getFullYear() / 10) * 10;
                    return { start: new Date(decadeStart, 0, 1), end: new Date(decadeStart + 9, 11, 31) };
                }
                case 'century-list': {
                    const centuryStart = Math.floor(anchor.getFullYear() / 100) * 100;
                    return { start: new Date(centuryStart, 0, 1), end: new Date(centuryStart + 99, 11, 31) };
                }
                default:
                    return { start: startOfDay(anchor), end: startOfDay(anchor) };
            }
        }

        function getHolidaysInRange(start, end) {
            const results = [];
            const seen = new Set();
            const cursor = new Date(start);

            while (cursor <= end) {
                const key = normalizeDateKey(cursor);
                const entries = holidayIndex[key] || [];

                entries.forEach((entry) => {
                    const uniqueKey = `${key}-${entry.label}-${entry.name}`;
                    if (!seen.has(uniqueKey)) {
                        seen.add(uniqueKey);
                        results.push({
                            date: new Date(cursor),
                            label: entry.label,
                            name: localizeHolidayName(entry.name)
                        });
                    }
                });

                cursor.setDate(cursor.getDate() + 1);
            }

            return results;
        }

        function renderHolidaySummaryIfNeeded() {
            els.holidayToggleBtn.classList.toggle('primary', state.showHolidayList);

            if (!state.showHolidayList) {
                return;
            }

            const { start, end } = getCurrentViewRange();
            const holidays = getHolidaysInRange(start, end);

            const summaryHtml = `
        <section class="holiday-summary">
            <h3>${t('holidaySummaryTitle')}</h3>
            <div class="holiday-summary-list">
                ${holidays.length ? holidays.map((holiday) => `
                    <article class="holiday-summary-item">
                        <strong>${escapeHtml(holiday.name)}</strong>
                        <small>${formatDateLong(holiday.date)} · [${holiday.label}]</small>
                    </article>
                `).join('') : `
                    <article class="holiday-summary-item">
                        <strong>${t('noEvents')}</strong>
                        <small>${t('noHolidaysInView')}</small>
                    </article>
                `}
            </div>
        </section>
    `;

            els.viewRoot.innerHTML = summaryHtml + els.viewRoot.innerHTML;
        }

        function render() {
            currentLang = state.currentLang;
            renderViewButtons();
            renderHeaderMeta();
            renderMiniCalendar();
            renderAgenda();
            renderActiveView();
            renderHolidaySummaryIfNeeded();
            updateLanguageButtons();
            syncJumpInput();
        }

        function renderViewButtons() {
            els.viewSwitcher.innerHTML = views().map((view) => `
                <button type="button" class="view-btn ${view.key === state.currentView ? 'active' : ''}" data-view="${view.key}">
                    ${view.label}
                </button>
            `).join('');

            els.viewSwitcher.querySelectorAll('[data-view]').forEach((button) => {
                button.addEventListener('click', () => {
                    state.currentView = button.dataset.view;
                    render();
                });
            });
        }

        function renderHeaderMeta() {
            const meta = getViewMeta();
            els.viewTitle.textContent = meta.title;
            els.viewSubtitle.textContent = meta.subtitle;
            els.rangeChips.innerHTML = [...meta.chips, t('holidaySourcesLabel') + ': PL / DE / US'].map((chip, index) => `
                <button type="button" class="chip-btn ${index === 0 ? 'active' : ''}">${chip}</button>
            `).join('');

            els.miniMonthLabel.textContent = `${monthNames()[state.anchorDate.getMonth()]} ${state.anchorDate.getFullYear()}`;
            els.miniMonthMeta.textContent = meta.short;
        }

        function renderMiniCalendar() {
            const monthStart = new Date(state.anchorDate.getFullYear(), state.anchorDate.getMonth(), 1);
            const gridStart = startOfWeek(monthStart);
            const days = [];

            dayNames().forEach((name) => {
                days.push(`<div class="mini-dow">${name}</div>`);
            });

            for (let i = 0; i < 42; i += 1) {
                const date = addDays(gridStart, i);
                const isCurrentMonth = date.getMonth() === monthStart.getMonth();
                const isToday = isSameDay(date, state.today);
                const holidayEntries = getHolidayEntries(date);
                const hasHoliday = holidayEntries.length > 0;
                days.push(`
                    <div class="mini-day ${!isCurrentMonth ? 'muted' : ''} ${isToday ? 'today' : ''} ${hasHoliday ? 'has-holiday' : ''}">${date.getDate()}</div>
                `);
            }

            els.miniCalendar.innerHTML = days.join('');
        }

        function renderAgenda() {
            const start = startOfWeek(state.anchorDate);
            const end = addDays(start, 13);
            const items = sampleEvents
                .filter((event) => event.date >= start && event.date <= end)
                .sort((a, b) => a.date - b.date)
                .slice(0, 4);

            els.agendaList.innerHTML = items.length
                ? items.map((event) => `
                    <article class="agenda-item">
                        <strong>${escapeHtml(event.title)}</strong>
                        <small>${formatDateLong(event.date)} · ${event.time}</small>
                    </article>
                `).join('')
                : `<div class="agenda-item"><strong>${t('noEvents')}</strong><small>${t('noEventsInRange')}</small></div>`;
        }

        function renderActiveView() {
            switch (state.currentView) {
                case 'century-list':
                    renderCenturyListView();
                    break;
                case 'decade-list':
                    renderDecadeListView();
                    break;
                case 'year':
                    renderYearView();
                    break;
                case 'week':
                    renderWeekView();
                    break;
                case 'month':
                default:
                    renderMonthView();
                    break;
            }
        }

        function renderMonthView() {
            const monthStart = new Date(state.anchorDate.getFullYear(), state.anchorDate.getMonth(), 1);
            const gridStart = startOfWeek(monthStart);
            const html = [];

            html.push('<div class="calendar-grid month-view">');
            html.push('<div class="dow-row">');
            dayNames().forEach((day) => html.push(`<div class="dow-cell">${day}</div>`));
            html.push('</div>');
            html.push('<div class="month-grid">');

            for (let i = 0; i < 42; i += 1) {
                const date = addDays(gridStart, i);
                const events = getEventsForDate(date);
                const isMuted = date.getMonth() !== monthStart.getMonth();
                const isToday = isSameDay(date, state.today);
                const holidays = getHolidayEntries(date);
                const hasHoliday = holidays.length > 0;

                html.push(`
                    <article class="day-cell ${isMuted ? 'muted' : ''} ${isToday ? 'today' : ''} ${hasHoliday ? 'has-holiday' : ''}">
                        <div class="day-head">
                            <span class="day-number">${date.getDate()}</span>
                            <small>${fullDayNames()[getWeekdayIndex(date)]}</small>
                        </div>
                        <div class="event-list">
                            ${[
                    ...holidays.map((holiday) => `
        <div class="event-pill holiday-pill">
            <strong>${escapeHtml(localizeHolidayName(holiday.name))}</strong>
            <small>[${holiday.label}]</small>
        </div>
    `),
                    ...events.slice(0, 3).map((event) => `
        <div class="event-pill">
            <strong>${escapeHtml(event.title)}</strong>
            <small>${event.time}</small>
        </div>
    `)
                ].join('') || `<small>${t('noEntries')}</small>`}
                        </div>
                    </article>
                `);
            }

            html.push('</div></div>');
            els.viewRoot.innerHTML = html.join('');
        }

        function renderWeekView() {
            const start = startOfWeek(state.anchorDate);
            const hours = Array.from({ length: 14 }, (_, i) => i + 7);
            const html = [];

            html.push('<div class="week-view">');
            html.push('<div class="week-row">');
            html.push('<div class="dow-cell">.</div>');
            for (let i = 0; i < 7; i += 1) {
                const date = addDays(start, i);
                const isToday = isSameDay(date, state.today);
                const holidays = getHolidayEntries(date);
                const hasHoliday = holidays.length > 0;
                html.push(`
                    <div class="dow-cell ${isToday ? 'today' : ''} ${hasHoliday ? 'has-holiday' : ''}">
                        <strong>${dayNames()[getWeekdayIndex(date)]}</strong><br>
                        <small>${date.getDate()} ${monthNamesGenitive()[date.getMonth()]}</small>
                        ${holidays.map((holiday) => `
    <div class="event-pill week-holiday-pill holiday-pill">
        <strong>${escapeHtml(localizeHolidayName(holiday.name))}</strong>
        <small>[${holiday.label}]</small>
    </div>
`).join('')}
                    </div>
                `);
            }
            html.push('</div>');
            html.push('<div class="week-grid">');

            hours.forEach((hour) => {
                html.push(`<div class="time-cell">${String(hour).padStart(2, '0')}:00</div>`);
                for (let i = 0; i < 7; i += 1) {
                    const date = addDays(start, i);
                    const events = getEventsForDate(date).filter((event) => Number(event.time.split(':')[0]) === hour);
                    const isToday = isSameDay(date, state.today);
                    const hasHoliday = getHolidayEntries(date).length > 0;
                    html.push(`
                        <div class="week-cell ${isToday ? 'today' : ''} ${hasHoliday ? 'has-holiday' : ''}">
                            ${events.map((event) => `
                                <div class="week-event">
                                    <strong>${escapeHtml(event.title)}</strong>
                                    <small>${event.time}</small>
                                </div>
                            `).join('')}
                        </div>
                    `);
                }
            });

            html.push('</div></div>');
            els.viewRoot.innerHTML = html.join('');
        }

        function renderYearView() {
            const year = state.anchorDate.getFullYear();
            const html = ['<div class="year-view"><div class="year-grid">'];

            for (let month = 0; month < 12; month += 1) {
                const monthStart = new Date(year, month, 1);
                const daysInMonth = new Date(year, month + 1, 0).getDate();
                html.push(`
                    <article class="year-card">
                        <div>
                            <strong>${monthNames()[month]}</strong>
                            <small>${daysInMonth} ${t('days')}</small>
                        </div>
                        <div class="year-mini">
                            ${buildYearMiniMonth(monthStart)}
                        </div>
                    </article>
                `);
            }

            html.push('</div></div>');
            els.viewRoot.innerHTML = html.join('');
        }

        function renderDecadeListView() {
            const decadeStart = Math.floor(state.anchorDate.getFullYear() / 10) * 10;
            const cards = [];

            for (let year = decadeStart; year < decadeStart + 10; year += 1) {
                cards.push(renderPeriodCard({
                    title: `${year}`,
                    subtitle: `${isLeapYear(year) ? t('leapYear') : t('standardYear')} · ${countEventsForYear(year)} ${t('sampleEventsCount')}`,
                    months: Array.from({ length: 12 }, (_, month) => ({
                        name: monthNames()[month],
                        meta: `${new Date(year, month + 1, 0).getDate()} ${t('days')}`
                    }))
                }));
            }

            els.viewRoot.innerHTML = `<div class="decade-view"><div class="decade-grid">${cards.join('')}</div></div>`;
        }

        function renderCenturyListView() {
            const centuryStart = Math.floor(state.anchorDate.getFullYear() / 100) * 100;
            const cards = [];

            for (let decade = centuryStart; decade < centuryStart + 100; decade += 10) {
                cards.push(renderPeriodCard({
                    title: `${decade}–${decade + 9}`,
                    subtitle: `${Array.from({ length: 10 }, (_, i) => decade + i).filter(isLeapYear).length} ${t('leapYearsCount')}`,
                    months: Array.from({ length: 10 }, (_, i) => ({
                        name: `${decade + i}`,
                        meta: `${countEventsForYear(decade + i)} ${t('demoEntries')}`
                    }))
                }));
            }

            els.viewRoot.innerHTML = `<div class="century-view"><div class="century-grid">${cards.join('')}</div></div>`;
        }

        function renderPeriodCard({ title, subtitle, months }) {
            return `
                <article class="period-card">
                    <header>
                        <div>
                            <h3 class="period-title">${escapeHtml(title)}</h3>
                            <p class="period-subtitle">${escapeHtml(subtitle)}</p>
                        </div>
                    </header>
                    <div class="period-grid">
                        ${months.map((item) => `
                            <div class="list-card">
                                <strong>${escapeHtml(item.name)}</strong>
                                <small>${escapeHtml(item.meta)}</small>
                            </div>
                        `).join('')}
                    </div>
                </article>
            `;
        }

        function buildYearMiniMonth(monthStart) {
            const year = monthStart.getFullYear();
            const month = monthStart.getMonth();
            const first = new Date(year, month, 1);
            const start = startOfWeek(first);
            const cells = [];

            dayNames().forEach((day) => {
                cells.push(`<span title="${day}">${day.slice(0, 1)}</span>`);
            });

            for (let i = 0; i < 35; i += 1) {
                const date = addDays(start, i);
                const isToday = isSameDay(date, state.today);
                const marker = date.getMonth() === month ? date.getDate() : '';
                const holidayTooltip = marker ? getHolidayTooltip(date) : '';
                const hasHoliday = holidayTooltip.length > 0;
                cells.push(`<span class="${isToday ? 'today' : ''} ${hasHoliday ? 'has-holiday' : ''}" ${holidayTooltip ? `title="${escapeHtml(holidayTooltip)}"` : ''}>${marker}</span>`);
            }

            return cells.join('');
        }

        function getViewMeta() {
            const year = state.anchorDate.getFullYear();
            const month = state.anchorDate.getMonth();
            const decadeStart = Math.floor(year / 10) * 10;
            const centuryStart = Math.floor(year / 100) * 100;
            const weekStart = startOfWeek(state.anchorDate);
            const weekEnd = addDays(weekStart, 6);

            switch (state.currentView) {
                case 'century-list':
                    return {
                        title: `1900–1999`.replace('1900', String(centuryStart)).replace('1999', String(centuryStart + 99)),
                        subtitle: t('centuryListDescription'),
                        short: `${centuryStart}–${centuryStart + 99}`,
                        chips: ['10 dekad', '100 lat', 'Lista'].map((item, index) => {
                            if (currentLang === 'pl') return item;
                            if (currentLang === 'en') return ['10 decades', '100 years', 'List'][index];
                            return ['10 Jahrzehnte', '100 Jahre', 'Liste'][index];
                        })
                    };
                case 'decade-list':
                    return {
                        title: `${decadeStart}–${decadeStart + 9}`,
                        subtitle: t('decadeListDescription'),
                        short: `${decadeStart}–${decadeStart + 9}`,
                        chips: ['10 lat', t('review'), t('list')].map((item, index) => {
                            if (currentLang === 'pl') return item;
                            if (currentLang === 'en') return ['10 years', 'Overview', 'List'][index];
                            return ['10 Jahre', 'Übersicht', 'Liste'][index];
                        })
                    };
                case 'year':
                    return {
                        title: `${t('yearWord')} ${year}`,
                        subtitle: t('yearAllMonths'),
                        short: `${year}`,
                        chips: [`12 ${t('monthsCount')}`, isLeapYear(year) ? t('days366') : t('days365'), t('grid')]
                    };
                case 'week':
                    return {
                        title: `${currentLang === 'pl' ? 'Tydzień' : currentLang === 'en' ? 'Week' : 'Woche'} ${formatDateShort(weekStart)} – ${formatDateShort(weekEnd)}`,
                        subtitle: t('weekHoursView'),
                        short: `${formatDateShort(weekStart)} – ${formatDateShort(weekEnd)}`,
                        chips: ['7 dni', t('hours'), t('plan')].map((item, index) => {
                            if (currentLang === 'pl') return item;
                            if (currentLang === 'en') return ['7 days', 'Hours', 'Plan'][index];
                            return ['7 Tage', 'Stunden', 'Plan'][index];
                        })
                    };
                case 'month':
                default:
                    return {
                        title: `${monthNames()[month]} ${year}`,
                        subtitle: t('fullMonthView'),
                        short: `${monthNames()[month]} ${year}`,
                        chips: ['42 pola', t('grid'), t('monthChip')].map((item, index) => {
                            if (currentLang === 'pl') return item;
                            if (currentLang === 'en') return ['42 cells', 'Grid', 'Month'][index];
                            return ['42 Felder', 'Raster', 'Monat'][index];
                        })
                    };
            }
        }

        function shiftRange(direction) {
            const factor = direction < 0 ? -1 : 1;
            switch (state.currentView) {
                case 'century-list':
                    state.anchorDate = new Date(state.anchorDate.getFullYear() + (100 * factor), state.anchorDate.getMonth(), 1);
                    break;
                case 'decade-list':
                    state.anchorDate = new Date(state.anchorDate.getFullYear() + (10 * factor), state.anchorDate.getMonth(), 1);
                    break;
                case 'year':
                    state.anchorDate = new Date(state.anchorDate.getFullYear() + factor, state.anchorDate.getMonth(), 1);
                    break;
                case 'week':
                    state.anchorDate = addDays(state.anchorDate, 7 * factor);
                    break;
                case 'month':
                default:
                    state.anchorDate = new Date(state.anchorDate.getFullYear(), state.anchorDate.getMonth() + factor, 1);
                    break;
            }
        }

        function getEventsForDate(date) {
            return sampleEvents.filter((event) => isSameDay(event.date, date));
        }

        function countEventsForYear(year) {
            return sampleEvents.filter((event) => event.date.getFullYear() === year).length;
        }

        function syncJumpInput() {
            const year = state.anchorDate.getFullYear();
            const month = String(state.anchorDate.getMonth() + 1).padStart(2, '0');
            els.jumpInput.value = `${year}-${month}`;
        }

        function formatDateLong(date) {
            return `${date.getDate()} ${monthNamesGenitive()[date.getMonth()]} ${date.getFullYear()}`;
        }

        function formatDateShort(date) {
            return `${String(date.getDate()).padStart(2, '0')}.${String(date.getMonth() + 1).padStart(2, '0')}.${date.getFullYear()}`;
        }

        function getWeekdayIndex(date) {
            return (date.getDay() + 6) % 7;
        }

        function startOfWeek(date) {
            const copy = startOfDay(date);
            copy.setDate(copy.getDate() - getWeekdayIndex(copy));
            return copy;
        }

        function startOfDay(date) {
            const copy = new Date(date);
            copy.setHours(0, 0, 0, 0);
            return copy;
        }

        function addDays(date, amount) {
            const copy = new Date(date);
            copy.setDate(copy.getDate() + amount);
            return copy;
        }

        function isSameDay(a, b) {
            return a.getFullYear() === b.getFullYear()
                && a.getMonth() === b.getMonth()
                && a.getDate() === b.getDate();
        }

        function isLeapYear(year) {
            return (year % 4 === 0 && year % 100 !== 0) || year % 400 === 0;
        }

        function escapeHtml(value) {
            return String(value)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#39;');
        }

        function normalizeDateKey(date) {
            const year = date.getFullYear();
            const month = String(date.getMonth() + 1).padStart(2, '0');
            const day = String(date.getDate()).padStart(2, '0');
            return `${year}${month}${day}`;
        }

        function buildHolidayIndex(sourceData) {
            const index = {};

            Object.entries(sourceData).forEach(([country, events]) => {
                events.forEach((event) => {
                    if (!index[event.date]) {
                        index[event.date] = [];
                    }
                    index[event.date].push({
                        country,
                        label: holidaySourceLabels[country] || country,
                        name: event.name
                    });
                });
            });

            return index;
        }

        function getHolidayEntries(date) {
            return holidayIndex[normalizeDateKey(date)] || [];
        }

        function getHolidayTooltip(date) {
            const holidays = getHolidayEntries(date);
            if (!holidays.length) {
                return '';
            }

            return `${t('holidayTooltipLabel')}:\n${holidays.map((holiday) => `[${holiday.label}] ${localizeHolidayName(holiday.name)}`).join('\n')}`;
        }

        function generateSampleEvents() {
            const baseYear = new Date().getFullYear();
            const seed = [
                { month: 0, day: 8, title: 'Plan sprintu', time: '09:00' },
                { month: 1, day: 14, title: 'Przegląd roadmapy', time: '11:00' },
                { month: 2, day: 3, title: 'Demo funkcji', time: '13:00' },
                { month: 3, day: 21, title: 'Warsztat UX', time: '10:00' },
                { month: 4, day: 9, title: 'Publikacja release', time: '16:00' },
                { month: 5, day: 17, title: 'Analiza KPI', time: '08:00' },
                { month: 6, day: 7, title: 'Retrospektywa', time: '15:00' },
                { month: 7, day: 19, title: 'Spotkanie zespołu', time: '12:00' },
                { month: 8, day: 4, title: 'Przegląd budżetu', time: '14:00' },
                { month: 9, day: 11, title: 'Warsztat API', time: '10:00' },
                { month: 10, day: 25, title: 'Testy wydajności', time: '09:00' },
                { month: 11, day: 6, title: 'Plan Q1', time: '17:00' }
            ];

            const result = [];
            for (let year = baseYear - 60; year <= baseYear + 60; year += 1) {
                seed.forEach((item, index) => {
                    const hourShift = (index % 5) + 8;
                    result.push({
                        date: new Date(year, item.month, item.day),
                        title: item.title,
                        time: `${String(hourShift).padStart(2, '0')}:00`
                    });
                });
            }

            result.push(
                { date: new Date(baseYear, new Date().getMonth(), new Date().getDate()), title: 'Dziś · punkt kontrolny', time: '10:00' },
                { date: addDays(new Date(baseYear, new Date().getMonth(), new Date().getDate()), 1), title: 'Jutro · follow-up', time: '13:00' }
            );

            return result;
        }
    })();
</script>
