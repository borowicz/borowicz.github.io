<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>The Political Spectrum — Interactive 2026</title>
  <style>
    :root {
      --bg-1: #eef2ff;
      --bg-2: #f8fafc;
      --text: #0f172a;
      --muted: #475569;
      --axis: #172033;
      --shadow: 0 18px 60px rgba(15, 23, 42, .12);
      --shadow-soft: 0 8px 24px rgba(15, 23, 42, .08);
      --ring: rgba(59, 130, 246, .25);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: stretch;
      padding: 0;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: var(--text);
      background:
        radial-gradient(circle at top left, rgba(96, 165, 250, .18), transparent 28%),
        radial-gradient(circle at top right, rgba(167, 139, 250, .12), transparent 24%),
        linear-gradient(180deg, var(--bg-1), var(--bg-2));
    }

    .canvas {
      position: relative;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      border: 0;
      border-radius: 0;
      background: linear-gradient(180deg, rgba(255, 255, 255, .97), rgba(255, 255, 255, .91));
      box-shadow: none;
      user-select: none;
      touch-action: none;
      backdrop-filter: blur(14px);
    }

    .canvas::before,
    .canvas::after {
      content: "";
      position: absolute;
      z-index: 0;
      border-radius: 999px;
      pointer-events: none;
      filter: blur(25px);
      opacity: .62;
    }

    .canvas::before {
      top: -60px;
      left: -50px;
      width: 240px;
      height: 240px;
      background: rgba(96, 165, 250, .15);
    }

    .canvas::after {
      right: -45px;
      bottom: -75px;
      width: 280px;
      height: 280px;
      background: rgba(167, 139, 250, .13);
    }

    .toolbar {
      position: absolute;
      inset: 15px 17px auto auto;
      z-index: 8;
      display: flex;
      align-items: center;
      gap: 9px;
      padding: 8px 10px 8px 13px;
      border: 1px solid rgba(148, 163, 184, .28);
      border-radius: 999px;
      background: rgba(255, 255, 255, .79);
      box-shadow: var(--shadow-soft);
      color: var(--muted);
      font-size: 13px;
      line-height: 1;
      backdrop-filter: blur(10px);
    }

    .toolbar .count {
      padding: 7px 10px;
      border-radius: 999px;
      background: #eef2ff;
      color: #4338ca;
      font-weight: 800;
      white-space: nowrap;
    }

    .toolbar .hint {
      font-weight: 650;
      white-space: nowrap;
    }

    .toolbar button {
      appearance: none;
      border: 0;
      border-radius: 999px;
      padding: 9px 15px;
      background: linear-gradient(180deg, #fff, #f1f5f9);
      box-shadow: inset 0 0 0 1px rgba(148, 163, 184, .34), 0 2px 10px rgba(15, 23, 42, .08);
      color: var(--text);
      font: inherit;
      font-weight: 750;
      cursor: pointer;
      transition: transform .16s ease, box-shadow .16s ease, background .16s ease;
    }

    .toolbar button:hover {
      transform: translateY(-1px);
      background: linear-gradient(180deg, #fff, #e2e8f0);
      box-shadow: inset 0 0 0 1px rgba(148, 163, 184, .44), 0 6px 14px rgba(15, 23, 42, .10);
    }

    .toolbar button:focus-visible {
      outline: none;
      box-shadow: 0 0 0 4px var(--ring);
    }

    svg {
      position: relative;
      z-index: 1;
      width: 100%;
      height: 100%;
      display: block;
    }

    text {
      fill: var(--text);
      pointer-events: none;
      paint-order: stroke;
      stroke: rgba(255, 255, 255, .84);
      stroke-width: 5px;
      stroke-linejoin: round;
    }

    .meta-label {
      font-size: 16px;
      font-weight: 850;
      letter-spacing: 3px;
      fill: #64748b;
      stroke-width: 0;
    }

    .title {
      font-size: 64px;
      font-weight: 860;
      letter-spacing: .4px;
    }

    .subtitle {
      font-size: 19px;
      font-weight: 560;
      fill: var(--muted);
      stroke-width: 0;
    }

    .point-label {
      font-size: 20px;
      font-weight: 790;
      letter-spacing: .15px;
    }

    .group-label,
    .center-label {
      font-size: 29px;
      font-weight: 790;
      letter-spacing: .4px;
    }

    .vertical-label {
      font-size: 31px;
      font-weight: 880;
      letter-spacing: 8px;
      fill: #1e293b;
    }

    .axis-glow {
      stroke: rgba(59, 130, 246, .10);
      stroke-width: 32;
      stroke-linecap: round;
    }

    .axis-track {
      stroke: rgba(148, 163, 184, .34);
      stroke-width: 5;
      stroke-linecap: round;
    }

    .axis {
      stroke-width: 14;
      stroke-linecap: butt;
    }

    .axis-arrowhead {
      filter: drop-shadow(0 3px 4px rgba(15, 23, 42, .14));
    }

    .guide {
      stroke: rgba(148, 163, 184, .20);
      stroke-width: 1.5;
      stroke-dasharray: 7 11;
    }

    .connector,
    .bracket {
      stroke: #1e293b;
      stroke-width: 4.2;
      fill: none;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .down-arrowhead { fill: #1e293b; }

    .zone-caption {
      font-size: 15px;
      font-weight: 850;
      letter-spacing: 2.2px;
      fill: #94a3b8;
      stroke-width: 0;
    }

    .point-hit {
      fill: transparent;
      cursor: grab;
      pointer-events: all;
    }

    .point.dragging .point-hit { cursor: grabbing; }

    .selection-ring {
      fill: none;
      stroke: rgba(59, 130, 246, .52);
      stroke-width: 4;
      opacity: 0;
      transition: opacity .14s ease;
    }

    .point.hovered .selection-ring,
    .point.focused .selection-ring,
    .point.pinned .selection-ring,
    .point.dragging .selection-ring {
      opacity: 1;
    }

    .dot {
      stroke: rgba(15, 23, 42, .96);
      stroke-width: 2.6;
      pointer-events: none;
      filter: drop-shadow(0 8px 13px rgba(15, 23, 42, .18));
      transition: transform .12s ease, filter .12s ease;
    }

    .point.hovered .dot,
    .point.focused .dot,
    .point.pinned .dot {
      transform: scale(1.06);
      filter: drop-shadow(0 12px 18px rgba(15, 23, 42, .22));
    }

    .point.dragging .dot {
      transform: scale(1.11);
      filter: drop-shadow(0 16px 23px rgba(15, 23, 42, .26));
    }

    /* Stick figures */
    .person {
      pointer-events: none;
      transform-box: fill-box;
      transform-origin: center bottom;
      animation: idleBob 2.25s ease-in-out infinite;
      animation-delay: var(--delay, 0s);
    }

    .person-line,
    .person-head,
    .person-eye,
    .person-mouth,
    .person-brow,
    .motion-line {
      vector-effect: non-scaling-stroke;
    }

    .person-line,
    .person-head,
    .person-mouth,
    .person-brow,
    .motion-line {
      fill: none;
      stroke: #111827;
      stroke-width: 3.2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .person-head { fill: rgba(255, 255, 255, .98); }
    .person-eye { fill: #111827; }
    .person-brow { opacity: 0; }
    .person-mouth { display: none; }
    .mouth-smile { display: block; }

    .arm-left,
    .arm-right,
    .leg-left,
    .leg-right {
      transform-box: fill-box;
      transform-origin: top center;
    }

    .motion-line {
      opacity: 0;
      stroke-width: 2.5;
    }

    .question-mark,
    .anger-mark {
      opacity: 0;
      font-size: 21px;
      font-weight: 900;
      stroke-width: 3px;
    }

    .point.mood-happy .mouth-smile,
    .point.mood-smug .mouth-smile { display: block; }

    .point.mood-happy .mouth-flat,
    .point.mood-happy .mouth-frown,
    .point.mood-happy .mouth-shout,
    .point.mood-smug .mouth-flat,
    .point.mood-smug .mouth-frown,
    .point.mood-smug .mouth-shout { display: none; }

    .point.mood-confused .mouth-flat,
    .point.mood-tired .mouth-flat { display: block; }

    .point.mood-confused .mouth-smile,
    .point.mood-confused .mouth-frown,
    .point.mood-confused .mouth-shout,
    .point.mood-tired .mouth-smile,
    .point.mood-tired .mouth-frown,
    .point.mood-tired .mouth-shout { display: none; }

    .point.mood-confused .question-mark { opacity: 1; }

    .point.mood-angry .mouth-shout,
    .point.mood-alarmed .mouth-frown { display: block; }

    .point.mood-angry .mouth-smile,
    .point.mood-angry .mouth-flat,
    .point.mood-angry .mouth-frown,
    .point.mood-alarmed .mouth-smile,
    .point.mood-alarmed .mouth-flat,
    .point.mood-alarmed .mouth-shout { display: none; }

    .point.mood-angry .person-brow,
    .point.mood-alarmed .person-brow { opacity: 1; }

    .point.mood-angry .anger-mark { opacity: 1; }

    .point.dragging .person {
      animation: walkingBob .28s ease-in-out infinite alternate;
    }

    .point.dragging .arm-left,
    .point.dragging .leg-right {
      animation: swingForward .34s ease-in-out infinite alternate;
    }

    .point.dragging .arm-right,
    .point.dragging .leg-left {
      animation: swingBack .34s ease-in-out infinite alternate;
    }

    .point.dragging .motion-line { opacity: .72; }

    .point.reacting .person {
      animation: reactionPop .45s cubic-bezier(.2, .9, .3, 1.25) 1;
    }

    /* Hover / press description */
    .quip-bubble {
      pointer-events: none;
      opacity: 1;
      visibility: visible;
      transition: opacity .15s ease, visibility .15s ease;
      filter: drop-shadow(0 9px 16px rgba(15, 23, 42, .13));
    }

    .quip-bubble.hidden {
      opacity: 0;
      visibility: hidden;
    }

    .quip-box {
      fill: rgba(255, 255, 255, .985);
      stroke: rgba(15, 23, 42, .92);
      stroke-width: 2.25;
    }

    .quip-tail {
      fill: rgba(255, 255, 255, .985);
      stroke: rgba(15, 23, 42, .92);
      stroke-width: 2.25;
      stroke-linejoin: round;
    }

    .quip-title {
      font-size: 13px;
      font-weight: 880;
      letter-spacing: 1.45px;
      fill: #64748b;
      stroke-width: 0;
    }

    .quip-text {
      font-size: 17px;
      font-weight: 775;
      fill: #0f172a;
      stroke-width: 0;
    }

    .quip-help {
      font-size: 11px;
      font-weight: 750;
      letter-spacing: .8px;
      fill: #94a3b8;
      stroke-width: 0;
    }

    .quip-bubble.pop { animation: bubblePop .32s cubic-bezier(.2, .9, .3, 1.25); }

    @keyframes idleBob {
      0%, 100% { transform: translateY(0) rotate(-1deg); }
      50% { transform: translateY(-3px) rotate(1deg); }
    }

    @keyframes walkingBob {
      from { transform: translateY(0) rotate(-2deg); }
      to { transform: translateY(-6px) rotate(2deg); }
    }

    @keyframes swingForward {
      from { transform: rotate(-22deg); }
      to { transform: rotate(22deg); }
    }

    @keyframes swingBack {
      from { transform: rotate(22deg); }
      to { transform: rotate(-22deg); }
    }

    @keyframes reactionPop {
      0% { transform: translateY(0) scale(1); }
      45% { transform: translateY(-11px) scale(1.12); }
      70% { transform: translateY(2px) scale(.97); }
      100% { transform: translateY(0) scale(1); }
    }

    @keyframes bubblePop {
      0% { opacity: .20; }
      100% { opacity: 1; }
    }

    @media (prefers-reduced-motion: reduce) {
      .person,
      .point.dragging .person,
      .point.dragging .arm-left,
      .point.dragging .arm-right,
      .point.dragging .leg-left,
      .point.dragging .leg-right,
      .point.reacting .person,
      .quip-bubble.pop {
        animation: none !important;
      }
    }

    @media (max-width: 900px) {
      body { padding: 0; }
      .canvas { border-radius: 0; }
      .toolbar { top: 8px; right: 8px; padding: 7px 9px; font-size: 11px; }
      .toolbar .hint { display: none; }
      .toolbar .count { padding: 6px 8px; }
    }
  </style>
</head>
<body>
  <main class="canvas">
    <div class="toolbar" aria-label="Chart controls">
      <span class="count">9 draggable people</span>
      <span class="hint">Hover to inspect · press to pin · drag to move</span>
      <button type="button" id="resetButton">Reset</button>
    </div>

    <svg id="spectrum" viewBox="0 0 1536 912" role="img" aria-labelledby="title desc">

      <desc id="desc">Nine independently draggable political points with animated stick figures. Hover or press a point to reveal a humorous description.</desc>

      <defs>

          <stop offset="0" stop-color="#2563eb" />

        </linearGradient>
      </defs>

      <text x="768" y="75" text-anchor="middle" class="meta-label">INTERACTIVE DIAGRAM · 2026</text>
      <text x="768" y="128" text-anchor="middle" class="title">The Political Spectrum</text>
      <text x="768" y="161" text-anchor="middle" class="subtitle">Nine people, one axis, absolutely no chance of agreement.</text>

      <!-- Hidden until hover, keyboard focus, dragging, or press/click. -->
      <g id="quipBubble" class="quip-bubble hidden" transform="translate(598 177)">
        <rect class="quip-box" x="0" y="0" width="340" height="83" rx="18" />

      <!-- Manual arrowheads keep their size and position predictable. -->
      <line x1="188" y1="407" x2="1348" y2="407" class="axis-glow" />
      <line x1="188" y1="407" x2="1348" y2="407" class="axis-track" />
      <line x1="188" y1="407" x2="1348" y2="407" class="axis" stroke="url(#axisGrad)" />
      <path class="axis-arrowhead" fill="#2563eb" d="M160 407 L188 394 L188 420 Z" aria-hidden="true" />
      <path class="axis-arrowhead" fill="#ef4444" d="M1376 407 L1348 394 L1348 420 Z" aria-hidden="true" />

    </svg>
  </main>

  <script>
    (() => {

      function personMarkup(delay) {
        return `
          <g class="person" style="--delay:${delay}s">

            <line class="person-line leg-right" x1="0" y1="344" x2="11" y2="366" />
            <path class="motion-line" d="M-24 325 H-34 M-24 336 H-38" />
            <text class="anger-mark" x="13" y="285">!</text>
            <text class="question-mark" x="13" y="285">?</text>
          </g>
        `;
      }

      function renderPoints() {
        pointsLayer.innerHTML = specs.map((spec, index) => {
          const labelY = index % 2 === 0 ? 467 : 504;
          return `
            <g class="point" data-index="${index}" data-name="${spec.name}" transform="translate(${spec.x} 0)">
              <rect
                class="point-hit"
                x="-38"
                y="278"
                width="76"
                height="164"
                rx="34"
                tabindex="0"
                role="slider"
                aria-label="${spec.name} position"
                aria-valuemin="0"
                aria-valuemax="100"
                aria-valuenow="0"
              />
              ${personMarkup((-0.22 * index).toFixed(2))}
              <circle class="selection-ring" cx="0" cy="407" r="31" />
              <circle class="dot" cx="0" cy="407" r="23" fill="${spec.color}" />
              <text x="0" y="${labelY}" text-anchor="middle" class="point-label">${spec.name}</text>
            </g>
          `;
        }).join('');

        pointGroups = [...pointsLayer.querySelectorAll('.point')];
        hitAreas = pointGroups.map(group => group.querySelector('.point-hit'));
      }

      function clientXToSvgX(clientX) {
        const point = svg.createSVGPoint();
        point.x = clientX;
        point.y = 0;
        const matrix = svg.getScreenCTM();
        return matrix ? point.matrixTransform(matrix.inverse()).x : clientX;
      }

      function positionPercent(index) {
        return Math.round(((positions[index] - axisMin) / (axisMax - axisMin)) * 100);
      }

      function zoneForPercent(percent) {
        return zones.find(zone => percent <= zone.max) || zones[zones.length - 1];
      }

      function applyMood(index) {
        const group = pointGroups[index];
        const zone = zoneForPercent(positionPercent(index));
        group.classList.remove(...moodClasses);
        group.classList.add(zone.mood);
      }

      function updatePinnedClasses() {
        pointGroups.forEach((group, index) => {
          group.classList.toggle('pinned', index === pinnedIndex);
          hitAreas[index].setAttribute('aria-pressed', index === pinnedIndex ? 'true' : 'false');
        });
      }

      function currentInfoIndex() {
        return activeIndex ?? hoverIndex ?? focusIndex ?? transientIndex ?? pinnedIndex;
      }

      function popBubble() {
        quipBubble.classList.remove('pop');
        void quipBubble.getBoundingClientRect();
        quipBubble.classList.add('pop');
      }

      function animateReaction(index) {
        pointGroups[index].classList.remove('reacting');
        void pointGroups[index].getBoundingClientRect();
        pointGroups[index].classList.add('reacting');
        window.clearTimeout(reactionTimer);
        reactionTimer = window.setTimeout(() => {
          pointGroups[index]?.classList.remove('reacting');
        }, 470);
      }

      function updateBubblePosition(index) {
        const pointX = positions[index];
        const bubbleX = clamp(pointX - bubbleWidth / 2, 112, 1536 - bubbleWidth - 112);
        const localTailX = clamp(pointX - bubbleX, 24, bubbleWidth - 24);
        quipBubble.setAttribute('transform', `translate(${bubbleX} ${bubbleY})`);
        quipTail.setAttribute(
          'd',
          `M${localTailX - 10} 82 L${localTailX} 96 L${localTailX + 10} 82 Z`
        );
      }

      function refreshBubble(forcePop = false) {
        const index = currentInfoIndex();

        if (index === null || index === undefined) {
          quipBubble.classList.add('hidden');
          lastBubbleKey = '';
          return;
        }

        const percent = positionPercent(index);
        const zone = zoneForPercent(percent);
        const spec = specs[index];
        const zoneIndex = zones.indexOf(zone);
        const pair = zone.quips[(index + zoneIndex) % zone.quips.length];
        const isPinned = pinnedIndex === index;
        const key = `${index}:${zone.title}:${isPinned}`;

        quipTitle.textContent =
          `${spec.name.toUpperCase()} · ${percent}% FROM LEFT${isPinned ? ' · PINNED' : ''}`;
        quipLine1.textContent = pair[0];
        quipLine2.textContent = pair[1];
        quipHelp.textContent = isPinned ? 'PRESS AGAIN TO UNPIN' : 'PRESS TO PIN';
        updateBubblePosition(index);
        quipBubble.classList.remove('hidden');

        if (forcePop || key !== lastBubbleKey) {
          lastBubbleKey = key;
          popBubble();
        }
      }

      function setTransient(index, duration = 1100) {
        window.clearTimeout(transientTimer);
        transientIndex = index;
        refreshBubble();
        transientTimer = window.setTimeout(() => {
          transientIndex = null;
          refreshBubble();
        }, duration);
      }

      function setPointPosition(index, requestedX, showTransient = false) {
        positions[index] = clamp(requestedX, axisMin, axisMax);
        pointGroups[index].setAttribute('transform', `translate(${positions[index]} 0)`);

        const percent = positionPercent(index);
        hitAreas[index].setAttribute('aria-valuenow', percent);
        hitAreas[index].setAttribute('aria-valuetext', `${percent}% from the left`);
        applyMood(index);

        if (showTransient && currentInfoIndex() === null) {
          setTransient(index);
        } else {
          refreshBubble();
        }
      }

      function startPress(event, index) {
        pointGroups[index].parentNode.appendChild(pointGroups[index]);

        activeIndex = index;
        pressState = {
          index,
          pointerId: event.pointerId,
          startClientX: event.clientX,
          moved: false
        };

        hitAreas[index].setPointerCapture(event.pointerId);
        refreshBubble(true);
        event.preventDefault();
      }

      function movePress(event) {
        if (!pressState || activeIndex === null) return;

        const distance = Math.abs(event.clientX - pressState.startClientX);
        if (distance > 5 && !pressState.moved) {
          pressState.moved = true;
          pointGroups[activeIndex].classList.add('dragging');
        }

        if (pressState.moved) {
          setPointPosition(activeIndex, clientXToSvgX(event.clientX));
        }
      }

      function endPress(event, cancelled = false) {
        if (!pressState || activeIndex === null) return;

        const index = activeIndex;
        const hit = hitAreas[index];

        if (event.pointerId != null && hit.hasPointerCapture(event.pointerId)) {
          hit.releasePointerCapture(event.pointerId);
        }

        pointGroups[index].classList.remove('dragging');

        if (!cancelled && !pressState.moved) {
          pinnedIndex = pinnedIndex === index ? null : index;
          updatePinnedClasses();
          animateReaction(index);
        } else if (!cancelled && pressState.moved) {
          setTransient(index, 1200);
        }

        activeIndex = null;
        pressState = null;
        refreshBubble(true);
      }

      function bindPointEvents() {
        hitAreas.forEach((hit, index) => {
          hit.addEventListener('pointerenter', event => {
            if (event.pointerType && event.pointerType !== 'mouse') return;
            hoverIndex = index;
            pointGroups[index].classList.add('hovered');
            refreshBubble(true);
          });

          hit.addEventListener('pointerleave', event => {
            if (event.pointerType && event.pointerType !== 'mouse') return;
            if (activeIndex === index) return;
            hoverIndex = hoverIndex === index ? null : hoverIndex;
            pointGroups[index].classList.remove('hovered');
            refreshBubble();
          });

          hit.addEventListener('pointerdown', event => startPress(event, index));
          hit.addEventListener('pointermove', movePress);
          hit.addEventListener('pointerup', event => endPress(event));
          hit.addEventListener('pointercancel', event => endPress(event, true));

          hit.addEventListener('lostpointercapture', () => {
            if (activeIndex === index && pressState) {
              pointGroups[index].classList.remove('dragging');
              activeIndex = null;
              pressState = null;
              refreshBubble();
            }
          });

          hit.addEventListener('focus', () => {
            focusIndex = index;
            pointGroups[index].classList.add('focused');
            refreshBubble(true);
          });

          hit.addEventListener('blur', () => {
            focusIndex = focusIndex === index ? null : focusIndex;
            pointGroups[index].classList.remove('focused');
            refreshBubble();
          });

          hit.addEventListener('keydown', event => {
            const step = event.shiftKey ? 28 : 10;

            if (event.key === 'ArrowLeft') {
              event.preventDefault();
              setPointPosition(index, positions[index] - step, true);
              animateReaction(index);
            } else if (event.key === 'ArrowRight') {
              event.preventDefault();
              setPointPosition(index, positions[index] + step, true);
              animateReaction(index);
            } else if (event.key === 'Home') {
              event.preventDefault();
              setPointPosition(index, axisMin, true);
              animateReaction(index);
            } else if (event.key === 'End') {
              event.preventDefault();
              setPointPosition(index, axisMax, true);
              animateReaction(index);
            } else if (event.key === 'Enter' || event.key === ' ') {
              event.preventDefault();
              pinnedIndex = pinnedIndex === index ? null : index;
              updatePinnedClasses();
              animateReaction(index);
              refreshBubble(true);
            } else if (event.key === 'Escape') {
              event.preventDefault();
              pinnedIndex = null;
              transientIndex = null;
              updatePinnedClasses();
              refreshBubble();
            }
          });
        });
      }

      function resetAll() {
        positions.splice(0, positions.length, ...initialPositions);
        pinnedIndex = null;
        hoverIndex = null;
        focusIndex = null;
        transientIndex = null;
        activeIndex = null;
        pressState = null;
        window.clearTimeout(transientTimer);

        pointGroups.forEach((group, index) => {
          group.setAttribute('transform', `translate(${positions[index]} 0)`);
          group.classList.remove('hovered', 'focused', 'pinned', 'dragging', 'reacting');
          const percent = positionPercent(index);
          hitAreas[index].setAttribute('aria-valuenow', percent);
          hitAreas[index].setAttribute('aria-valuetext', `${percent}% from the left`);
          hitAreas[index].setAttribute('aria-pressed', 'false');
          applyMood(index);
        });

        quipBubble.classList.add('hidden');
        lastBubbleKey = '';
      }

      renderPoints();
      bindPointEvents();
      resetButton.addEventListener('click', resetAll);
      resetAll();
    })();
  </script>
</body>
</html>
