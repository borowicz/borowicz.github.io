<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- 1. HTML Meta Redirect (0 second delay) -->
    <meta http-equiv="refresh" content="0; url=./shortcuts.html">

    <title>Redirecting...</title>

    <!-- 2. JavaScript Redirect (Best for UX) -->
    <script type="text/javascript">
        // Using replace() prevents the user from getting stuck in a back-button loop
        window.location.replace("./shortcuts.html");
    </script>
</head>
<body>
<!-- 3. HTML Fallback -->
<p>If you are not redirected, <a href="./shortcuts.html">click here</a>.</p>
</body>
</html>
