<!doctype html>
<html lang="en">
<head>
    <title>URL Tools</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #0b1020;
            --panel: #121933;
            --panel-2: #1a2347;
            --text: #e8ecff;
            --muted: #aab4da;
            --accent: #7c9cff;
            --accent-2: #4ee1c1;
            --danger: #ff6b81;
            --border: rgba(255, 255, 255, .08);
            --shadow: 0 10px 30px rgba(0, 0, 0, .28)
        }

        * {
            box-sizing: border-box
        }

        html, body {
            margin: 0;
            padding: 0;
            font-family: Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
            background: linear-gradient(180deg, #0a0f1d, #0f1630 35%, #0a1020);
            color: var(--text);
            min-height: 100%
        }

        a {
            color: inherit;
            text-decoration: none
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px
        }

        .topbar {
            display: flex;
            gap: 12px;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            margin-bottom: 18px
        }

        .brand {
            display: flex;
            gap: 12px;
            align-items: center
        }

        .logo {
            width: 42px;
            height: 42px;
            border-radius: 14px;
            background: linear-gradient(135deg, var(--accent), var(--accent-2));
            box-shadow: var(--shadow)
        }

        .title h1 {
            margin: 0;
            font-size: 1.25rem
        }

        .title p {
            margin: 2px 0 0;
            color: var(--muted);
            font-size: .92rem
        }

        .actions {
            display: flex;
            gap: 10px;
            flex-wrap: wrap
        }

        .btn, .file {
            border: 1px solid var(--border);
            background: linear-gradient(180deg, var(--panel-2), var(--panel));
            color: var(--text);
            padding: 10px 14px;
            border-radius: 12px;
            cursor: pointer;
            box-shadow: var(--shadow)
        }

        .btn:hover {
            transform: translateY(-1px)
        }

        .grid {
            display: grid;
            grid-template-columns:repeat(12, 1fr);
            gap: 16px
        }

        .card {
            grid-column: span 12;
            background: linear-gradient(180deg, rgba(255, 255, 255, .03), rgba(255, 255, 255, .01));
            border: 1px solid var(--border);
            border-radius: 20px;
            padding: 18px;
            box-shadow: var(--shadow);
            backdrop-filter: blur(4px)
        }

        @media (min-width: 860px) {
            .span-5 {
                grid-column: span 5
            }

            .span-7 {
                grid-column: span 7
            }

            .span-6 {
                grid-column: span 6
            }

            .span-4 {
                grid-column: span 4
            }

            .span-8 {
                grid-column: span 8
            }

            .span-12 {
                grid-column: span 12
            }
        }

        label {
            display: block;
            font-size: .88rem;
            color: var(--muted);
            margin: 0 0 8px
        }

        input, select, textarea {
            width: 100%;
            background: #0b1228;
            color: var(--text);
            border: 1px solid var(--border);
            border-radius: 14px;
            padding: 12px 14px;
            outline: none
        }

        textarea {
            min-height: 220px;
            resize: vertical
        }

        input:focus, select:focus, textarea:focus {
            border-color: rgba(124, 156, 255, .7);
            box-shadow: 0 0 0 3px rgba(124, 156, 255, .15)
        }

        .row {
            display: grid;
            grid-template-columns:repeat(12, 1fr);
            gap: 12px
        }

        .col-6 {
            grid-column: span 12
        }

        .col-4 {
            grid-column: span 12
        }

        .col-3 {
            grid-column: span 12
        }

        .col-8 {
            grid-column: span 12
        }

        @media (min-width: 860px) {
            .col-6 {
                grid-column: span 6
            }

            .col-4 {
                grid-column: span 4
            }

            .col-3 {
                grid-column: span 3
            }

            .col-8 {
                grid-column: span 8
            }
        }

        .muted {
            color: var(--muted)
        }

        .small {
            font-size: .88rem
        }

        pre, code, .output {
            background: #091022;
            border: 1px solid var(--border);
            border-radius: 14px;
            padding: 14px;
            overflow: auto;
            white-space: pre-wrap;
            word-break: break-word
        }

        .toolbar {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin-top: 12px
        }

        .badge {
            display: inline-block;
            padding: 6px 10px;
            border-radius: 999px;
            background: rgba(124, 156, 255, .12);
            border: 1px solid rgba(124, 156, 255, .25);
            font-size: .8rem;
            color: #dbe4ff
        }

        .list {
            display: grid;
            gap: 10px
        }

        .kv {
            display: grid;
            grid-template-columns:180px 1fr;
            gap: 10px
        }

        .table {
            width: 100%;
            border-collapse: collapse
        }

        .table th, .table td {
            border-bottom: 1px solid var(--border);
            padding: 10px;
            text-align: left;
            vertical-align: top
        }

        .table th {
            color: var(--muted);
            font-weight: 600
        }

        .hero {
            margin: 4px 0 16px;
            color: var(--muted)
        }

        nav.links {
            display: grid;
            grid-template-columns:repeat(auto-fit, minmax(210px, 1fr));
            gap: 14px
        }

        nav.links a {
            display: block;
            padding: 16px;
            border-radius: 18px;
            background: linear-gradient(180deg, var(--panel-2), var(--panel));
            border: 1px solid var(--border);
            box-shadow: var(--shadow)
        }

        nav.links a strong {
            display: block;
            margin-bottom: 6px
        }

        .hl {
            background: rgba(255, 230, 102, .18);
            border-radius: 6px;
            padding: 0 2px
        }

        .footer {
            margin-top: 18px;
            color: var(--muted);
            font-size: .86rem
        }
    </style>
</head>
<body>
<div class="container">
    <div class="topbar">
        <div class="brand">
            <div class="logo"></div>
            <div class="title">
                <h1>URL Tools</h1>
                <p>Parse URLs and rebuild query strings</p>
            </div>
        </div>
        <div class="actions">
            <a class="btn" href="./index.html">← Back to toolbox</a>
        </div>
    </div>

    <div class="grid">
        <div class="card span-7">
            <label>URL</label>
            <textarea id="urlInput" spellcheck="false">https://example.com/products/list?page=2&sort=price&utm_source=newsletter&utm_medium=email#details</textarea>
            <div class="toolbar">
                <button class="btn" onclick="parseUrl()">Parse</button>
                <button class="btn" onclick="rebuildFromTable()">Rebuild URL</button>
                <button class="btn" onclick="addUtm()">Add sample UTM</button>
                <button class="btn" onclick="copyUrl()">Copy rebuilt URL</button>
            </div>
        </div>
        <div class="card span-5">
            <div id="rebuilt" class="output"></div>
        </div>
        <div class="card span-12">
            <table class="table">
                <tbody id="parts"></tbody>
            </table>
        </div>
        <div class="card span-12">
            <h3 style="margin-top:0">Query parameters</h3>
            <div id="params" class="list"></div>
        </div>
    </div>

    <div class="footer">
        <p style="text-align: center; color: #1a2347">&copy; <a style="color: #cccc;" href="./../" title="borowicz.github.io">borowicz.github.io</a>
    </div>
</div>

<script>
    const urlInput = document.getElementById('urlInput');
    const parts = document.getElementById('parts');
    const paramsWrap = document.getElementById('params');
    const rebuilt = document.getElementById('rebuilt');

    function parseUrl() {
        try {
            const u = new URL(urlInput.value.trim());
            parts.innerHTML = `
      <tr><th>Origin</th><td>${u.origin}</td></tr>
      <tr><th>Protocol</th><td>${u.protocol}</td></tr>
      <tr><th>Host</th><td>${u.host}</td></tr>
      <tr><th>Pathname</th><td><input id="pathname" value="${u.pathname}"></td></tr>
      <tr><th>Hash</th><td><input id="hash" value="${u.hash.replace(/^#/, '')}"></td></tr>
    `;
            paramsWrap.innerHTML = '';
            [...u.searchParams.entries()].forEach(([k, v], i) => addParamRow(k, v, i));
            if ([...u.searchParams.keys()].length === 0) addParamRow('', '', 0);
            rebuildFromTable();
        } catch (e) {
            rebuilt.textContent = e.message;
        }
    }

    function addParamRow(k = '', v = '', i = 0) {
        const div = document.createElement('div');
        div.className = 'row';
        div.innerHTML = `
    <div class="col-4"><input class="param-key" placeholder="key" value="${escapeHtml(k)}"></div>
    <div class="col-8"><input class="param-val" placeholder="value" value="${escapeHtml(v)}"></div>
  `;
        paramsWrap.appendChild(div);
    }

    function rebuildFromTable() {
        try {
            const base = new URL(urlInput.value.trim());
            const path = document.getElementById('pathname')?.value ?? base.pathname;
            const hash = document.getElementById('hash')?.value ?? base.hash.replace(/^#/, '');
            const keys = [...document.querySelectorAll('.param-key')].map(el => el.value);
            const vals = [...document.querySelectorAll('.param-val')].map(el => el.value);
            const u = new URL(base.origin);
            u.pathname = path;
            keys.forEach((k, i) => {
                if (k) u.searchParams.append(k, vals[i] ?? '');
            });
            if (hash) u.hash = hash;
            rebuilt.textContent = u.toString();
        } catch (e) {
            rebuilt.textContent = e.message;
        }
    }

    function addUtm() {
        parseUrl();
        addParamRow('utm_campaign', 'spring_launch');
        rebuildFromTable();
    }

    async function copyUrl() {
        await navigator.clipboard.writeText(rebuilt.textContent);
    }

    function escapeHtml(s) {
        return String(s).replace(/[&<>"]/g, c => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;'}[c]));
    }

    parseUrl();
    document.addEventListener('input', e => {
        if (e.target.matches('#pathname,#hash,.param-key,.param-val')) rebuildFromTable();
    });
</script>

</body>
</html>
