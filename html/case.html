<!doctype html>
<html lang="en">
<head>
    <title>Case Converter</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #0b1020;
            --panel: #121933;
            --panel-2: #1a2347;
            --text: #e8ecff;
            --muted: #aab4da;
            --accent: #7c9cff;
            --accent-2: #4ee1c1;
            --danger: #ff6b81;
            --border: rgba(255, 255, 255, .08);
            --shadow: 0 10px 30px rgba(0, 0, 0, .28)
        }

        * {
            box-sizing: border-box
        }

        html, body {
            margin: 0;
            padding: 0;
            font-family: Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
            background: linear-gradient(180deg, #0a0f1d, #0f1630 35%, #0a1020);
            color: var(--text);
            min-height: 100%
        }

        a {
            color: inherit;
            text-decoration: none
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px
        }

        .topbar {
            display: flex;
            gap: 12px;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            margin-bottom: 18px
        }

        .brand {
            display: flex;
            gap: 12px;
            align-items: center
        }

        .logo {
            width: 42px;
            height: 42px;
            border-radius: 14px;
            background: linear-gradient(135deg, var(--accent), var(--accent-2));
            box-shadow: var(--shadow)
        }

        .title h1 {
            margin: 0;
            font-size: 1.25rem
        }

        .title p {
            margin: 2px 0 0;
            color: var(--muted);
            font-size: .92rem
        }

        .actions {
            display: flex;
            gap: 10px;
            flex-wrap: wrap
        }

        .btn, .file {
            border: 1px solid var(--border);
            background: linear-gradient(180deg, var(--panel-2), var(--panel));
            color: var(--text);
            padding: 10px 14px;
            border-radius: 12px;
            cursor: pointer;
            box-shadow: var(--shadow)
        }

        .btn:hover {
            transform: translateY(-1px)
        }

        .grid {
            display: grid;
            grid-template-columns:repeat(12, 1fr);
            gap: 16px
        }

        .card {
            grid-column: span 12;
            background: linear-gradient(180deg, rgba(255, 255, 255, .03), rgba(255, 255, 255, .01));
            border: 1px solid var(--border);
            border-radius: 20px;
            padding: 18px;
            box-shadow: var(--shadow);
            backdrop-filter: blur(4px)
        }

        @media (min-width: 860px) {
            .span-5 {
                grid-column: span 5
            }

            .span-7 {
                grid-column: span 7
            }

            .span-6 {
                grid-column: span 6
            }

            .span-4 {
                grid-column: span 4
            }

            .span-8 {
                grid-column: span 8
            }

            .span-12 {
                grid-column: span 12
            }
        }

        label {
            display: block;
            font-size: .88rem;
            color: var(--muted);
            margin: 0 0 8px
        }

        input, select, textarea {
            width: 100%;
            background: #0b1228;
            color: var(--text);
            border: 1px solid var(--border);
            border-radius: 14px;
            padding: 12px 14px;
            outline: none
        }

        textarea {
            min-height: 220px;
            resize: vertical
        }

        input:focus, select:focus, textarea:focus {
            border-color: rgba(124, 156, 255, .7);
            box-shadow: 0 0 0 3px rgba(124, 156, 255, .15)
        }

        .row {
            display: grid;
            grid-template-columns:repeat(12, 1fr);
            gap: 12px
        }

        .col-6 {
            grid-column: span 12
        }

        .col-4 {
            grid-column: span 12
        }

        .col-3 {
            grid-column: span 12
        }

        .col-8 {
            grid-column: span 12
        }

        @media (min-width: 860px) {
            .col-6 {
                grid-column: span 6
            }

            .col-4 {
                grid-column: span 4
            }

            .col-3 {
                grid-column: span 3
            }

            .col-8 {
                grid-column: span 8
            }
        }

        .muted {
            color: var(--muted)
        }

        .small {
            font-size: .88rem
        }

        pre, code, .output {
            background: #091022;
            border: 1px solid var(--border);
            border-radius: 14px;
            padding: 14px;
            overflow: auto;
            white-space: pre-wrap;
            word-break: break-word
        }

        .toolbar {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin-top: 12px
        }

        .badge {
            display: inline-block;
            padding: 6px 10px;
            border-radius: 999px;
            background: rgba(124, 156, 255, .12);
            border: 1px solid rgba(124, 156, 255, .25);
            font-size: .8rem;
            color: #dbe4ff
        }

        .list {
            display: grid;
            gap: 10px
        }

        .kv {
            display: grid;
            grid-template-columns:180px 1fr;
            gap: 10px
        }

        .table {
            width: 100%;
            border-collapse: collapse
        }

        .table th, .table td {
            border-bottom: 1px solid var(--border);
            padding: 10px;
            text-align: left;
            vertical-align: top
        }

        .table th {
            color: var(--muted);
            font-weight: 600
        }

        .hero {
            margin: 4px 0 16px;
            color: var(--muted)
        }

        nav.links {
            display: grid;
            grid-template-columns:repeat(auto-fit, minmax(210px, 1fr));
            gap: 14px
        }

        nav.links a {
            display: block;
            padding: 16px;
            border-radius: 18px;
            background: linear-gradient(180deg, var(--panel-2), var(--panel));
            border: 1px solid var(--border);
            box-shadow: var(--shadow)
        }

        nav.links a strong {
            display: block;
            margin-bottom: 6px
        }

        .hl {
            background: rgba(255, 230, 102, .18);
            border-radius: 6px;
            padding: 0 2px
        }

        .footer {
            margin-top: 18px;
            color: var(--muted);
            font-size: .86rem
        }
    </style>
</head>
<body>
<div class="container">
    <div class="topbar">
        <div class="brand">
            <div class="logo"></div>
            <div class="title">
                <h1>Case Converter</h1>
                <p>Convert text between common naming conventions</p>
            </div>
        </div>
        <div class="actions">
            <a class="btn" href="./index.html">← Back to toolbox</a>
        </div>
    </div>

    <div class="grid">
        <div class="card span-7">
            <label>Input</label>
            <textarea id="caseInput">sample text for case conversion</textarea>
            <div class="toolbar">
                <button class="btn" onclick="renderCases()">Convert</button>
                <button class="btn" onclick="copyFirst()">Copy camelCase</button>
            </div>
        </div>
        <div class="card span-5">
            <table class="table">
                <tbody id="caseTable"></tbody>
            </table>
        </div>
    </div>

    <div class="footer">
        <p style="text-align: center; color: #1a2347">&copy; <a style="color: #cccc;" href="./../" title="borowicz.github.io">borowicz.github.io</a>
    </div>
</div>


<script>
    function words(s) {
        return s.trim().replace(/[_-]+/g, ' ').replace(/([a-z])([A-Z])/g, '$1 $2').split(/\s+/).filter(Boolean).map(w => w.toLowerCase());
    }

    function cap(w) {
        return w ? w[0].toUpperCase() + w.slice(1) : '';
    }

    function renderCases() {
        const w = words(document.getElementById('caseInput').value);
        const cases = {
            camelCase: w.map((x, i) => i ? cap(x) : x).join(''),
            PascalCase: w.map(cap).join(''),
            snake_case: w.join('_'),
            'kebab-case': w.join('-'),
            'UPPER_SNAKE': w.join('_').toUpperCase(),
            lowercase: w.join(' '),
            'Title Case': w.map(cap).join(' ')
        };
        document.getElementById('caseTable').innerHTML = Object.entries(cases).map(([k, v]) => `<tr><th>${k}</th><td>${v}</td></tr>`).join('');
    }

    async function copyFirst() {
        const val = [...document.querySelectorAll('#caseTable tr td')][0]?.textContent || '';
        await navigator.clipboard.writeText(val);
    }

    renderCases();
</script>

</body>
</html>
