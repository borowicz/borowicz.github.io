<!doctype html>
<html lang="en">
<head>
    <title>JSON Tools</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #0b1020;
            --panel: #121933;
            --panel-2: #1a2347;
            --text: #e8ecff;
            --muted: #aab4da;
            --accent: #7c9cff;
            --accent-2: #4ee1c1;
            --danger: #ff6b81;
            --border: rgba(255, 255, 255, .08);
            --shadow: 0 10px 30px rgba(0, 0, 0, .28)
        }

        * {
            box-sizing: border-box
        }

        html, body {
            margin: 0;
            padding: 0;
            font-family: Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
            background: linear-gradient(180deg, #0a0f1d, #0f1630 35%, #0a1020);
            color: var(--text);
            min-height: 100%
        }

        a {
            color: inherit;
            text-decoration: none
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px
        }

        .topbar {
            display: flex;
            gap: 12px;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            margin-bottom: 18px
        }

        .brand {
            display: flex;
            gap: 12px;
            align-items: center
        }

        .logo {
            width: 42px;
            height: 42px;
            border-radius: 14px;
            background: linear-gradient(135deg, var(--accent), var(--accent-2));
            box-shadow: var(--shadow)
        }

        .title h1 {
            margin: 0;
            font-size: 1.25rem
        }

        .title p {
            margin: 2px 0 0;
            color: var(--muted);
            font-size: .92rem
        }

        .actions {
            display: flex;
            gap: 10px;
            flex-wrap: wrap
        }

        .btn, .file {
            border: 1px solid var(--border);
            background: linear-gradient(180deg, var(--panel-2), var(--panel));
            color: var(--text);
            padding: 10px 14px;
            border-radius: 12px;
            cursor: pointer;
            box-shadow: var(--shadow)
        }

        .btn:hover {
            transform: translateY(-1px)
        }

        .grid {
            display: grid;
            grid-template-columns:repeat(12, 1fr);
            gap: 16px
        }

        .card {
            grid-column: span 12;
            background: linear-gradient(180deg, rgba(255, 255, 255, .03), rgba(255, 255, 255, .01));
            border: 1px solid var(--border);
            border-radius: 20px;
            padding: 18px;
            box-shadow: var(--shadow);
            backdrop-filter: blur(4px)
        }

        @media (min-width: 860px) {
            .span-5 {
                grid-column: span 5
            }

            .span-7 {
                grid-column: span 7
            }

            .span-6 {
                grid-column: span 6
            }

            .span-4 {
                grid-column: span 4
            }

            .span-8 {
                grid-column: span 8
            }

            .span-12 {
                grid-column: span 12
            }
        }

        label {
            display: block;
            font-size: .88rem;
            color: var(--muted);
            margin: 0 0 8px
        }

        input, select, textarea {
            width: 100%;
            background: #0b1228;
            color: var(--text);
            border: 1px solid var(--border);
            border-radius: 14px;
            padding: 12px 14px;
            outline: none
        }

        textarea {
            min-height: 220px;
            resize: vertical
        }

        input:focus, select:focus, textarea:focus {
            border-color: rgba(124, 156, 255, .7);
            box-shadow: 0 0 0 3px rgba(124, 156, 255, .15)
        }

        .row {
            display: grid;
            grid-template-columns:repeat(12, 1fr);
            gap: 12px
        }

        .col-6 {
            grid-column: span 12
        }

        .col-4 {
            grid-column: span 12
        }

        .col-3 {
            grid-column: span 12
        }

        .col-8 {
            grid-column: span 12
        }

        @media (min-width: 860px) {
            .col-6 {
                grid-column: span 6
            }

            .col-4 {
                grid-column: span 4
            }

            .col-3 {
                grid-column: span 3
            }

            .col-8 {
                grid-column: span 8
            }
        }

        .muted {
            color: var(--muted)
        }

        .small {
            font-size: .88rem
        }

        pre, code, .output {
            background: #091022;
            border: 1px solid var(--border);
            border-radius: 14px;
            padding: 14px;
            overflow: auto;
            white-space: pre-wrap;
            word-break: break-word
        }

        .toolbar {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin-top: 12px
        }

        .badge {
            display: inline-block;
            padding: 6px 10px;
            border-radius: 999px;
            background: rgba(124, 156, 255, .12);
            border: 1px solid rgba(124, 156, 255, .25);
            font-size: .8rem;
            color: #dbe4ff
        }

        .list {
            display: grid;
            gap: 10px
        }

        .kv {
            display: grid;
            grid-template-columns:180px 1fr;
            gap: 10px
        }

        .table {
            width: 100%;
            border-collapse: collapse
        }

        .table th, .table td {
            border-bottom: 1px solid var(--border);
            padding: 10px;
            text-align: left;
            vertical-align: top
        }

        .table th {
            color: var(--muted);
            font-weight: 600
        }

        .hero {
            margin: 4px 0 16px;
            color: var(--muted)
        }

        nav.links {
            display: grid;
            grid-template-columns:repeat(auto-fit, minmax(210px, 1fr));
            gap: 14px
        }

        nav.links a {
            display: block;
            padding: 16px;
            border-radius: 18px;
            background: linear-gradient(180deg, var(--panel-2), var(--panel));
            border: 1px solid var(--border);
            box-shadow: var(--shadow)
        }

        nav.links a strong {
            display: block;
            margin-bottom: 6px
        }

        .hl {
            background: rgba(255, 230, 102, .18);
            border-radius: 6px;
            padding: 0 2px
        }

        .footer {
            margin-top: 18px;
            color: var(--muted);
            font-size: .86rem
        }
    </style>
</head>
<body>
<div class="container">
    <div class="topbar">
        <div class="brand">
            <div class="logo"></div>
            <div class="title">
                <h1>JSON Tools</h1>
                <p>Format, validate, minify and sort JSON</p>
            </div>
        </div>
        <div class="actions">
            <a class="btn" href="./index.html">← Back to toolbox</a>
        </div>
    </div>

    <div class="grid">
        <div class="card span-7">
            <label for="jsonInput">Input JSON</label>
            <textarea id="jsonInput" spellcheck="false">{
  "name": "Example",
  "items": [3, 1, 2],
  "enabled": true
}</textarea>
            <div class="toolbar">
                <button class="btn" onclick="formatJson()">Format</button>
                <button class="btn" onclick="minifyJson()">Minify</button>
                <button class="btn" onclick="sortKeys()">Sort keys</button>
                <button class="btn" onclick="escapeString()">Escape as string</button>
                <button class="btn" onclick="unescapeString()">Unescape string</button>
                <button class="btn" onclick="copyOutput()">Copy output</button>
            </div>
        </div>
        <div class="card span-5">
            <div class="badge" id="status">Ready</div>
            <p class="hero">Validation status and output.</p>
            <pre id="jsonOutput"></pre>
        </div>
    </div>

    <div class="footer">
        <p style="text-align: center; color: #1a2347">&copy; <a style="color: #cccc;" href="./../" title="borowicz.github.io">borowicz.github.io</a>
    </div>
</div>

<script>
    const input = document.getElementById('jsonInput');
    const output = document.getElementById('jsonOutput');
    const statusEl = document.getElementById('status');
    const parse = () => JSON.parse(input.value);

    function setStatus(ok, text) {
        statusEl.textContent = text;
        statusEl.style.background = ok ? 'rgba(78,225,193,.12)' : 'rgba(255,107,129,.12)';
        statusEl.style.borderColor = ok ? 'rgba(78,225,193,.25)' : 'rgba(255,107,129,.25)';
    }

    function stableSort(value) {
        if (Array.isArray(value)) return value.map(stableSort);
        if (value && typeof value === 'object') {
            return Object.keys(value).sort().reduce((acc, key) => {
                acc[key] = stableSort(value[key]);
                return acc;
            }, {});
        }
        return value;
    }

    function formatJson() {
        try {
            output.textContent = JSON.stringify(parse(), null, 2);
            setStatus(true, 'Valid JSON');
        } catch (e) {
            output.textContent = e.message;
            setStatus(false, 'Invalid JSON');
        }
    }

    function minifyJson() {
        try {
            output.textContent = JSON.stringify(parse());
            setStatus(true, 'Valid JSON');
        } catch (e) {
            output.textContent = e.message;
            setStatus(false, 'Invalid JSON');
        }
    }

    function sortKeys() {
        try {
            output.textContent = JSON.stringify(stableSort(parse()), null, 2);
            setStatus(true, 'Sorted');
        } catch (e) {
            output.textContent = e.message;
            setStatus(false, 'Invalid JSON');
        }
    }

    function escapeString() {
        output.textContent = JSON.stringify(input.value);
        setStatus(true, 'Escaped as JSON string');
    }

    function unescapeString() {
        try {
            output.textContent = JSON.parse(input.value);
            setStatus(true, 'String unescaped');
        } catch (e) {
            output.textContent = e.message;
            setStatus(false, 'Could not unescape');
        }
    }

    async function copyOutput() {
        await navigator.clipboard.writeText(output.textContent);
    }

    formatJson();
</script>

</body>
</html>
